      return next;
    });
    // [Part 10] 실제 체크인 기록뿐 아니라, 그 자리를 대신하고 있던 오늘자 수동 오버라이드(예: 수동 '출석')가
    // 있다면 그것도 함께 지워야 '취소' 버튼이 실제로 미출석 상태로 되돌아간다.
    const { ok, all } = await removeManualAttendanceRecord(todayKey, id);
    if (ok) {
      setTodayManualForDate(all[todayKey] || {});
      if (manualEditDate === todayKey) setManualForDate(all[todayKey] || {});
    }
  }, [todayKey, manualEditDate]);

  // ---- [수동 출결 수정 - Part 2] 특정 날짜/학생의 수동 출결 오버라이드 저장/해제 ----
  // 실제 읽기/쓰기는 위쪽 데이터 레이어 함수(saveManualAttendanceRecord 등)가 전담하고,
  // 여기서는 화면 상태(manualForDate)를 그 결과와 맞춰주는 역할만 한다.
  // UI는 아직 없음 (다음 단계에서 연결 예정). [Part 3] resolveDailyAttendance는 이제 manualForDate를
  // 받아 수동 오버라이드를 최우선으로 반영하지만(상세 출석부 저장 시 자동 연결), 이 저장/해제 함수들 자체는
  // 여전히 화면 상태(manualForDate)만 갱신할 뿐 UI 버튼은 아직 없다.
  const setManualAttendance = useCallback(async (studentId, dateStr, payload) => {
    // payload: { status: 'present'|'absent'|'leave'|'not_arrived', time, timeband, absenceReason, customReason }
    const { ok, all } = await saveManualAttendanceRecord(dateStr, studentId, payload);
    if (!ok) { setSaveError('수동 출결 저장에 실패했어요. 다시 시도해주세요.'); return; }
    if (dateStr === manualEditDate) setManualForDate(all[dateStr] || {});
    // [Part 10] 오늘 날짜를 수정했다면, 출석체크/결석·연락/공유텍스트/일일 내보내기가 쓰는
    // todayManualForDate도 함께 갱신해서 모든 화면이 즉시 같은 값을 보도록 한다.
    if (dateStr === todayKey) setTodayManualForDate(all[dateStr] || {});
  }, [manualEditDate, todayKey]);

  // 한 날짜에 여러 학생의 수동 출결을 한번에 저장할 때 쓰는 배치 버전.
  const setManualAttendanceBatch = useCallback(async (dateStr, recordsByStudentId) => {
    const { ok, all } = await saveManualAttendanceRecords(dateStr, recordsByStudentId);
    if (!ok) { setSaveError('수동 출결 저장에 실패했어요. 다시 시도해주세요.'); return; }
    if (dateStr === manualEditDate) setManualForDate(all[dateStr] || {});
    if (dateStr === todayKey) setTodayManualForDate(all[dateStr] || {});
  }, [manualEditDate, todayKey]);

  const clearManualAttendance = useCallback(async (studentId, dateStr) => {
    const { ok, all } = await removeManualAttendanceRecord(dateStr, studentId);
    if (!ok) { setSaveError('수동 출결 해제에 실패했어요. 다시 시도해주세요.'); return; }
    if (dateStr === manualEditDate) setManualForDate(all[dateStr] || {});
    if (dateStr === todayKey) setTodayManualForDate(all[dateStr] || {});
  }, [manualEditDate, todayKey]);

  // [Part 8 - 결석·연락 탭 통합] 결석·연락 탭의 "오늘 결석 처리됨" 목록에서 수동 결석/휴원 기록을 바로
  // 수정할 수 있게 한다. [날짜별 수정] 탭과 완전히 동일한 모달(ManualEditModal)·저장 로직을 재사용하되,
  // 다른 날짜를 보던 중이었더라도 이 버튼은 항상 "오늘" 기록을 열도록 manualEditDate를 먼저 오늘로 맞춘다.
  const openManualEditForToday = useCallback((s) => {
    setManualEditDate(todayKey);
    setManualEditingStudent(s);
  }, [todayKey]);

  // [Part 8] 결석·연락 탭에서 오늘자 수동 결석/휴원 기록을 바로 취소(해제)한다 - clearManualAttendance 재사용.
  const removeManualToday = useCallback((studentId) => {
    clearManualAttendance(studentId, todayKey);
  }, [clearManualAttendance, todayKey]);

  // [날짜별 수정 - 일괄 수정] 선택된 학생 전체에게 같은 출결 값을 한번에 저장한다.
  // 저장 자체는 기존 데이터 레이어(saveManualAttendanceRecords, 단일 키를 한번만 갈아끼워 저장)를 그대로 재사용하므로
  // 선택되지 않은 학생/다른 날짜의 기록에는 전혀 영향을 주지 않는다.
  const applyManualAttendanceBulk = useCallback(async (payload) => {
    const ids = (manualSelectedIds || []).filter(id => !!studentById[id]);
    setManualBulkStatus(null);
    if (ids.length === 0) return;
    const recordsByStudentId = {};
    ids.forEach(id => { recordsByStudentId[id] = payload; });
    const { ok, all } = await saveManualAttendanceRecords(manualEditDate, recordsByStudentId);
    if (!ok) {
      setSaveError('일괄 출결 저장에 실패했어요. 다시 시도해주세요.');
      return;
    }
    setManualForDate(all[manualEditDate] || {});
    // [Part 10] 일괄 적용한 날짜가 오늘이면 todayManualForDate도 함께 갱신한다.
    if (manualEditDate === todayKey) setTodayManualForDate(all[manualEditDate] || {});
    setManualSelectedIds([]);
    setToast(`${ids.length}명 ${MANUAL_EDIT_STATUS_LABEL[payload.status] || ''} 일괄 적용 완료`);
    setTimeout(() => setToast(''), 2400);
  }, [manualSelectedIds, studentById, manualEditDate, todayKey]);

  // ---- 결석 등록/수정 저장 ----
  const addAbsence = useCallback(async (record, editId) => {
    const label = (studentById[record.studentId] && studentById[record.studentId].label) || '';
    setAbsences(prev => {
      const next = { ...prev };
      const id = editId || `ab_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      const prevCreatedAt = editId && prev[editId] ? prev[editId].createdAt : null;
      next[id] = { ...record, createdAt: prevCreatedAt || dateKey(new Date()) };
      storageSetJSON(ABSENCES_KEY, next).then(ok => { if (!ok) setSaveError('결석 등록 저장에 실패했어요. 다시 시도해주세요.'); });
      return next;
    });
    setAbsenceModalStudent(null);
    setAbsenceEditRecord(null);
    setToast(`${label} 결석 ${editId ? '수정' : '등록'} 완료`);
    setTimeout(() => setToast(''), 2200);
  }, [studentById]);

  // ---- 결석 등록 취소(삭제) ----
  const removeAbsence = useCallback((absenceId) => {
    if (!absenceId) return;
    setAbsences(prev => {
      if (!prev[absenceId]) return prev;
      const next = { ...prev };
      delete next[absenceId];
      storageSetJSON(ABSENCES_KEY, next).then(ok => { if (!ok) setSaveError('결석 취소 저장에 실패했어요.'); });
      return next;
    });
    setToast('결석 등록을 취소했어요');
    setTimeout(() => setToast(''), 2000);
  }, []);

  // ---- 휴원 처리 (재원생 -> 휴원생, 사유+시작일 저장) ----
  const setEnrollmentLeave = useCallback((record) => {
    const label = (studentById[record.studentId] && studentById[record.studentId].label) || '';
    setEnrollments(prev => {
      const next = { ...prev };
      const cur = prev[record.studentId];
      next[record.studentId] = {
        status: 'leave',
        reasonType: record.reasonType,
        customReason: record.customReason || '',
        startDate: record.startDate,
        history: (cur && cur.history) || [],
      };
      storageSetJSON(ENROLLMENTS_KEY, next).then(ok => { if (!ok) setSaveError('휴원 처리 저장에 실패했어요.'); });
      return next;
    });
    setEnrollmentModalStudent(null);
    setToast(`${label} 휴원 처리 완료`);
    setTimeout(() => setToast(''), 2200);
  }, [studentById]);

  // ---- 재원 처리 (휴원생 -> 재원생, 지금까지의 휴원 기간은 history에 보관해서 과거 출석부엔 계속 휴원으로 남김) ----
  const releaseEnrollment = useCallback((studentId) => {
    const label = (studentById[studentId] && studentById[studentId].label) || '';
    setEnrollments(prev => {
      const cur = prev[studentId];
      if (!cur || cur.status !== 'leave') return prev;
      const next = { ...prev };
      const todayDk = dateKey(new Date());
      const closedHistory = [
        ...(cur.history || []),
        { startDate: cur.startDate, endDate: todayDk, reasonType: cur.reasonType, customReason: cur.customReason },
      ];
      next[studentId] = { status: 'enrolled', history: closedHistory };
      storageSetJSON(ENROLLMENTS_KEY, next).then(ok => { if (!ok) setSaveError('재원 처리 저장에 실패했어요.'); });
      return next;
    });
    setToast(`${label} 재원 처리 완료`);
    setTimeout(() => setToast(''), 2200);
  }, [studentById]);

  const todayWeekday = weekdayKrOf(now);
  const todayOff = useMemo(() => dayOffInfo(todayKey, closures), [todayKey, closures]);

  // ---- 출석체크 탭: 명단 필터링 ----
  // [Part 10] 수동 오버라이드가 최우선이라는 원칙(resolveDailyAttendance와 동일)을 이 탭에도 그대로 적용한다.
  // 오늘 날짜에 수동 기록이 있는 학생은: '출석/결석/휴원'으로 이미 확정된 것이므로 체크 대상에서 제외하고,
  // '미등원'이면 아직 체크 가능한 상태로 그대로 남겨둔다. 수동 기록이 없는 학생만 기존 자동 판정을 그대로 쓴다.
  const checkList = useMemo(() => {
    if (!meta || !students) return [];
    return students.filter(s => {
      const manual = todayManualForDate ? todayManualForDate[s.id] : null;
      if (manual) {
        if (manual.status !== MANUAL_STATUS.NOT_ARRIVED) return false;
      } else {
        if (todayAttendance[s.id]) return false;
        if (leaveInfoForDate(s.id, todayKey, enrollments)) return false;
        if (findAbsenceForDate(s.id, todayKey, absences)) return false;
      }
      if (selectedGrade && s.grade !== selectedGrade) return false;
      if (selectedCho && chosungBase(s.name) !== selectedCho) return false;
      return true;
    });
  }, [meta, students, todayAttendance, selectedGrade, selectedCho, enrollments, todayKey, absences, todayManualForDate]);

  // [Part 10] 출석 완료 명단도 수동 오버라이드를 반영한다: 수동으로 '출석' 처리된 학생은 실제 체크인이
  // 없어도 여기 나타나고(수동 시각/시간반 표시), 반대로 실제 체크인이 있어도 수동으로 다른 상태(결석/휴원/
  // 미등원)로 바뀌었다면 이 목록에서는 빠진다 (resolveDailyAttendance와 동일한 우선순위).
  const checkedInList = useMemo(() => {
    const map = {};
    Object.keys(todayAttendance).forEach(id => {
      map[id] = {
        id, label: (studentById[id] && studentById[id].label) || id,
        time: todayAttendance[id].time || '', timeband: todayAttendance[id].timeband || '',
      };
    });
    Object.keys(todayManualForDate || {}).forEach(id => {
      const m = todayManualForDate[id];
      if (!m) return;
      if (m.status === MANUAL_STATUS.PRESENT) {
        map[id] = {
          id, label: (studentById[id] && studentById[id].label) || id,
          time: m.time || '', timeband: m.timeband || '',
        };
      } else {
        delete map[id];
      }
    });
    return Object.values(map).sort((a, b) => a.time.localeCompare(b.time));
  }, [todayAttendance, todayManualForDate, studentById]);

  // ---- 결석자(전화/문자) 탭 ----
  // [Part 10] 체크리스트와 동일한 원칙: 수동 기록이 있으면 그 값이 최우선이며, '미등원'일 때만
  // (아직 연락이 필요한 상태로 보고) 목록에 남긴다.
  const absentToday = useMemo(() => {
    if (!meta || !students || todayOff.off) return [];
    return students.filter(s => {
      const m = metaOf(s.id);
      if (!m.days || !m.days.includes(todayWeekday)) return false;
      const manual = todayManualForDate ? todayManualForDate[s.id] : null;
      if (manual) {
        if (manual.status !== MANUAL_STATUS.NOT_ARRIVED) return false;
      } else {
        if (todayAttendance[s.id]) return false;
        if (leaveInfoForDate(s.id, todayKey, enrollments)) return false;
        if (findAbsenceForDate(s.id, todayKey, absences)) return false;
      }
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name));
  }, [meta, students, todayAttendance, todayWeekday, metaOf, todayOff, enrollments, todayKey, absences, todayManualForDate]);

  // ---- 오늘 이미 결석/휴원 처리된 학생 (수정/취소 가능하게 별도로 모아둠) ----
  // [Part 8 - 결석·연락 탭 통합] 기존에는 결석 등록(findAbsenceForDate, 자동 기록)만 보고 만들어서,
  // [날짜별 수정] 탭에서 오늘 날짜에 수동으로 '결석'/'휴원' 처리한 학생은 이 목록에 전혀 나타나지 않고
  // 화면에서 그냥 사라지는 문제가 있었다(미출석 목록에서는 빠지는데 여기엔 안 뜨는 모순).
  // checkList/checkedInList/absentToday와 동일한 우선순위(수동 > 자동)로 통합한다:
  //  - 오늘자 수동 오버라이드가 '결석' 또는 '휴원'이면 그 값을 최우선으로 보여준다(수정/취소는 수동 기록 기준).
  //  - 수동 오버라이드가 '출석'/'미등원'이면 예전 결석 등록 기록이 남아있어도 더 이상 결석이 아니므로 표시하지 않는다.
  //  - 수동 오버라이드가 아예 없는 학생만 기존처럼 결석 등록(자동) 기록을 그대로 보여준다.
  const absenceRegisteredToday = useMemo(() => {
    if (!meta || !students) return [];
    return students
      .map(s => {
        const manual = todayManualForDate ? todayManualForDate[s.id] : null;
        if (manual) {
          if (manual.status === MANUAL_STATUS.ABSENT) {
            const reasonText = (manual.absenceReason === '기타' && manual.customReason)
              ? `기타(${manual.customReason})` : (manual.absenceReason || '결석');
            return { student: s, source: 'manual', manualStatus: 'absent', reasonText };
          }
          if (manual.status === MANUAL_STATUS.LEAVE) {
            const reasonText = manual.leaveReason ? `휴원(${manual.leaveReason})` : '휴원';
            return { student: s, source: 'manual', manualStatus: 'leave', reasonText };
          }
          return null; // 수동 '출석'/'미등원' -> 결석 처리됨 목록에는 표시하지 않음
        }
        if (todayAttendance[s.id] || leaveInfoForDate(s.id, todayKey, enrollments)) return null;
        const rec = findAbsenceForDate(s.id, todayKey, absences);
        if (!rec) return null;
        return { student: s, source: 'auto', rec };
      })
      .filter(Boolean)
      .sort((a, b) => a.student.name.localeCompare(b.student.name));
  }, [meta, students, todayAttendance, enrollments, todayKey, absences, todayManualForDate]);

  // ---- [날짜별 수정] 탭: 선택된 날짜(manualEditDate) 기준, 전체 원생의 최종(자동+수동) 출결 상태를 한번에 계산 ----
  // resolveDailyAttendance를 그대로 재사용하므로 상세 출석부/요약표와 판정 로직이 완전히 동일하다.
  const manualResolvedList = useMemo(() => {
    if (!meta || !students || !manualEditDate) return [];
    const today0 = startOfDay(now);
    return students
      .map(s => ({
        student: s,
        result: resolveDailyAttendance({
          studentId: s.id,
          dateStr: manualEditDate,
          studentMeta: metaOf(s.id),
          attendanceForDate: manualDateAttendance,
          absences, closures, enrollments,
          manualForDate,
          today0,
        }),
      }))
      .sort((a, b) => (a.student.grade || '').localeCompare(b.student.grade || '') || a.student.name.localeCompare(b.student.name));
  }, [meta, students, manualEditDate, manualDateAttendance, absences, closures, enrollments, manualForDate, metaOf, now]);

  // [Part 8] 개별 수정 모달(ManualEditModal)에 넘길 "현재 기록"/"현재 계산 결과"를 구한다.
  // manualForDate/manualResolvedList는 [날짜별 수정] 탭에서 manualEditDate가 바뀔 때 useEffect로
  // 비동기 로드되므로, 결석·연락 탭에서 openManualEditForToday()로 manualEditDate를 "오늘"로 프로그램적으로
  // 바꾸는 순간에는 아직 갱신 전이라 한 렌더링 동안 예전 날짜 값을 잠깐 보여줄 수 있다(경쟁 상태).
  // dateStr이 오늘(todayKey)일 때는 이미 항상 최신으로 동기화되어 있는 todayAttendance/todayManualForDate를
  // 직접 써서 이 경쟁 상태를 없앤다. 그 외 날짜([날짜별 수정] 탭에서 직접 연 경우)는 기존처럼
  // manualDateAttendance/manualForDate를 그대로 쓴다(동작 변경 없음).
  const manualEditModalCurrentRecord = useMemo(() => {
    if (!manualEditingStudent) return null;
    const src = manualEditDate === todayKey ? todayManualForDate : manualForDate;
    return (src && src[manualEditingStudent.id]) || null;
  }, [manualEditingStudent, manualEditDate, todayKey, todayManualForDate, manualForDate]);

  const manualEditModalResolvedResult = useMemo(() => {
    if (!manualEditingStudent || !manualEditDate) return null;
    const attForDate = manualEditDate === todayKey ? todayAttendance : manualDateAttendance;
    const manualForThatDate = manualEditDate === todayKey ? todayManualForDate : manualForDate;
    const today0 = startOfDay(now);
    return resolveDailyAttendance({
      studentId: manualEditingStudent.id, dateStr: manualEditDate,
      studentMeta: metaOf(manualEditingStudent.id),
      attendanceForDate: attForDate, absences, closures, enrollments,
      manualForDate: manualForThatDate, today0,
    });
  }, [manualEditingStudent, manualEditDate, todayKey, todayAttendance, manualDateAttendance, todayManualForDate, manualForDate, absences, closures, enrollments, metaOf, now]);

  // ---- 카톡 등으로 공유할 텍스트 만들기 ----
  const shareTodayAttendance = useCallback(async () => {
    const lines = checkedInList.map(c => `· ${c.label} ${c.time}${c.timeband ? ' · ' + c.timeband : ''}`);
    const text = `[정도태권도] ${displayDateLong(now)} 출석 현황\n총 ${checkedInList.length}명 출석\n\n${lines.join('\n') || '(출석자 없음)'}`;
    const result = await shareText(text);
    if (result === 'copied') { setToast('클립보드에 복사했어요 · 카카오톡에 붙여넣어 공유하세요'); setTimeout(() => setToast(''), 2600); }
    else if (result === 'failed') { setToast('공유에 실패했어요'); setTimeout(() => setToast(''), 2200); }
  }, [checkedInList, now]);

  const shareAbsentToday = useCallback(async () => {
    const lines = absentToday.map(s => {
      const parts = [];
      if (s.fatherPhone) parts.push(`아버님 ${formatPhoneLabel(s.fatherName, s.fatherPhone)}`);
      if (s.motherPhone) parts.push(`어머님 ${formatPhoneLabel(s.motherName, s.motherPhone)}`);
      return `· ${s.label}(${s.grade || '학년미상'}) ${parts.length ? '- ' + parts.join(' / ') : '- 연락처 미등록'}`;
    });
    const text = `[정도태권도] ${displayDateLong(now)} 미출석 명단 (${absentToday.length}명)\n\n${lines.join('\n') || '(미출석자 없음)'}`;
    const result = await shareText(text);
    if (result === 'copied') { setToast('클립보드에 복사했어요 · 카카오톡에 붙여넣어 공유하세요'); setTimeout(() => setToast(''), 2600); }
    else if (result === 'failed') { setToast('공유에 실패했어요'); setTimeout(() => setToast(''), 2200); }
  }, [absentToday, now]);

  // ---- 앱에 저장된 모든 데이터(원생/스케줄/전체 출석기록/결석사유/휴관일/재원-휴원상태)를 백업 payload로 만든다 ----
  const buildFullBackupPayload = useCallback(async () => {
    const attKeys = await storageListKeys('att-');
    const attendanceByDate = {};
    await Promise.all(attKeys.map(async (k) => {
      const dk = k.slice(4); // 'att-' 접두사 제거
      attendanceByDate[dk] = (dk === todayKey) ? todayAttendance : ((await storageGetJSON(k)) || {});
    }));
    // 아직 att-키가 생성되기 전(오늘 첫 출석체크 전)이어도 오늘 기록은 빠지지 않게 보정
    if (!attendanceByDate[todayKey]) attendanceByDate[todayKey] = todayAttendance;

    return {
      type: 'dojang-full-backup',
      version: 1,
      exportedAt: dateKey(new Date()),
      students: students || [],
      meta: meta || {},
      closures: closures || {},
      absences: absences || {},
      enrollments: enrollments || {},
      attendanceByDate,
    };
  }, [students, meta, closures, absences, enrollments, todayKey, todayAttendance]);

  // ---- 전체 백업 공유(카카오톡/문자로 텍스트 보내기) ----
  const shareFullBackup = useCallback(async () => {
    const payload = await buildFullBackupPayload();
    const text = buildFullBackupText(payload);
    const result = await shareText(text);
    if (result === 'copied') { setToast('클립보드에 복사했어요 · 카카오톡에 붙여넣어 공유하세요'); setTimeout(() => setToast(''), 2600); }
    else if (result === 'failed') { setToast('공유에 실패했어요'); setTimeout(() => setToast(''), 2200); }
  }, [buildFullBackupPayload]);

  // ---- 다른 폰에서 받은 전체 백업 텍스트를 내 기록과 "서로 추가"로 합친다 ----
  // 이미 내 쪽에 있는 기록/학생/설정은 건드리지 않고, 없는 것만 채워 넣는 방식(합치기)이라
  // 양쪽 폰에서 번갈아 보내고 받아도 데이터가 서로 덮어써지지 않는다.
  const importFullBackup = useCallback(async (text) => {
    const payload = parseBackupPayloadFromText(text);
    if (!payload) { setToast('올바른 백업 데이터를 찾지 못했어요'); setTimeout(() => setToast(''), 2200); return false; }

    let addedStudents = 0, addedMeta = 0, addedClosures = 0, addedAbs = 0, addedEnrollments = 0, addedAttDays = 0, addedAttEntries = 0;

    // 1) 원생 목록 합치기 (id가 로컬에 없는 학생만 추가)
    if (Array.isArray(payload.students) && payload.students.length > 0) {
      setStudents(prev => {
        const cur = prev || [];
        const existingIds = new Set(cur.map(s => s.id));
        const toAdd = payload.students.filter(s => s && s.id && !existingIds.has(s.id));
        if (toAdd.length === 0) return cur;
        addedStudents = toAdd.length;
        const next = [...cur, ...toAdd];
        storageSetJSON(STUDENTS_KEY, next);
        return next;
      });
    }

    // 2) 요일 스케줄(meta) 합치기 (studentId별로 로컬에 없는 것만 추가)
    if (payload.meta && typeof payload.meta === 'object') {
      setMeta(prev => {
        const cur = prev || {};
        const next = { ...cur };
        Object.keys(payload.meta).forEach(sid => {
          if (!next[sid]) { next[sid] = payload.meta[sid]; addedMeta++; }
        });
        if (addedMeta === 0) return cur;
        storageSetJSON(META_KEY, next);
        return next;
      });
    }

    // 3) 휴관일 합치기 (날짜별로 로컬에 없는 것만 추가)
    if (payload.closures && typeof payload.closures === 'object') {
      setClosures(prev => {
        const next = { ...prev };
        Object.keys(payload.closures).forEach(dk => {
          if (!next[dk]) { next[dk] = payload.closures[dk]; addedClosures++; }
        });
        if (addedClosures === 0) return prev;
        storageSetJSON(CLOSURES_KEY, next);
        return next;
      });
    }

    // 4) 결석 사유 등록 기록 합치기 (학생+기간+사유가 완전히 같으면 중복 추가하지 않음)
    if (payload.absences && typeof payload.absences === 'object') {
      setAbsences(prev => {
        const next = { ...prev };
        const existingKeys = new Set(Object.values(prev).map(a => `${a.studentId}_${a.startDate}_${a.endDate}_${a.reasonType}_${a.customReason || ''}`));
        Object.values(payload.absences).forEach(a => {
          const k = `${a.studentId}_${a.startDate}_${a.endDate}_${a.reasonType}_${a.customReason || ''}`;
          if (!existingKeys.has(k)) {
            const id = `ab_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            next[id] = { ...a, createdAt: a.createdAt || dateKey(new Date()) };
            existingKeys.add(k);
            addedAbs++;
          }
        });
        if (addedAbs === 0) return prev;
        storageSetJSON(ABSENCES_KEY, next);
        return next;
      });
    }

    // 5) 재원/휴원 상태 합치기 (studentId별로 로컬에 없는 것만 추가 - 이미 있으면 최근 상태를 존중해 건드리지 않음)
    if (payload.enrollments && typeof payload.enrollments === 'object') {
      setEnrollments(prev => {
        const next = { ...prev };
        Object.keys(payload.enrollments).forEach(sid => {
          if (!next[sid]) { next[sid] = payload.enrollments[sid]; addedEnrollments++; }
        });
        if (addedEnrollments === 0) return prev;
        storageSetJSON(ENROLLMENTS_KEY, next);
        return next;
      });
    }

    // 6) 날짜별 출석체크 기록 합치기 (모든 날짜 - 학생 단위로 로컬에 없는 것만 추가)
    if (payload.attendanceByDate && typeof payload.attendanceByDate === 'object') {
      const dates = Object.keys(payload.attendanceByDate);
      await Promise.all(dates.map(async (dk) => {
        const localAtt = (dk === todayKey) ? todayAttendance : ((await storageGetJSON('att-' + dk)) || {});
        const mergedAtt = { ...localAtt };
        let addedHere = 0;
        Object.keys(payload.attendanceByDate[dk] || {}).forEach(sid => {
          if (!mergedAtt[sid]) { mergedAtt[sid] = payload.attendanceByDate[dk][sid]; addedHere++; }
        });
        if (addedHere > 0) {
          await storageSetJSON('att-' + dk, mergedAtt);
          if (dk === todayKey) setTodayAttendance(mergedAtt);
          addedAttDays++;
          addedAttEntries += addedHere;
        }
      }));
    }

    setToast(`합치기 완료 · 원생 +${addedStudents}, 스케줄 +${addedMeta}, 휴관일 +${addedClosures}, 결석등록 +${addedAbs}, 출석 +${addedAttEntries}(${addedAttDays}일)`);
    setTimeout(() => setToast(''), 3200);
    return true;
  }, [todayKey, todayAttendance]);

  // ---- 전체 백업을 .json 파일로 다운로드 ----
  const downloadFullBackupJSON = useCallback(async () => {
    const payload = await buildFullBackupPayload();
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `정도태권도_백업_${dateKey(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    setToast('JSON 파일로 내보냈어요');
    setTimeout(() => setToast(''), 2200);
  }, [buildFullBackupPayload]);

  // ---- .json 백업 파일을 읽어서 가져오기(합치기) ----
  const importFullBackupFromFile = useCallback(async (file) => {
    if (!file) return false;
    try {
      const text = await file.text();
      return await importFullBackup(text);
    } catch (e) {
      setToast('파일을 읽는 데 실패했어요');
      setTimeout(() => setToast(''), 2200);
      return false;
    }
  }, [importFullBackup]);

  // ---- 일일 출결표 다운로드 ----
  // [Part 10] 일일 내보내기도 상세/주간/월간 엑셀과 동일하게 공용 resolveDailyAttendance를 통해
  // 계산해서, 그 날짜에 수동 오버라이드 기록이 있으면 무조건 최우선으로 반영되도록 한다
  // (기존에는 출석기록/휴원만 보고 직접 상태를 만들어서 수동 수정・결석 등록 사유가 반영되지 않았음).
  const exportDaily = useCallback(async (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    const dk = dateKey(d);
    const att = (dk === todayKey) ? todayAttendance : (await storageGetJSON('att-' + dk) || {});
    const manualForDk = (dk === todayKey) ? todayManualForDate : await loadManualAttendanceForDate(dk);
    const wk = weekdayKrOf(d);
    const off = dayOffInfo(dk, closures);
    const today0 = startOfDay(now);
    const rawRows = [];
    (students || []).forEach(s => {
      const m = metaOf(s.id);
      const scheduled = m.days && m.days.includes(wk);
      const result = resolveDailyAttendance({
        studentId: s.id, dateStr: dk, studentMeta: m,
        attendanceForDate: att, absences, closures, enrollments,
        manualForDate: manualForDk, today0,
      });
      const presentFinal = result.status === '출석';
      if (!scheduled && !presentFinal && !result.isLeave && !result.isManual) return;
      let status;
      if (result.isManual) {
        // 수동 출석은 '출석'으로, 수동 결석/휴원은 사유가 있으면 그 사유(예: '병결', '기타(가족 행사)')를,
        // 미등원은 '미등원' 그대로 표시한다.
        if (result.status === '출석') status = '출석';
        else status = result.displayText || result.status || '';
      } else if (presentFinal) {
        status = '출석';
      } else if (result.isLeave) {
        status = result.displayText; // 예: '휴원(병결)'
      } else if (result.absenceReason) {
        status = result.displayText || result.absenceReason; // 결석 등록된 사유(병결/여행/휴가/기타)
      } else if (off.off) {
        status = off.label ? `휴관(${off.label})` : '휴관';
      } else if (scheduled) {
        status = '결석';
      } else {
        status = result.displayText || '결석';
      }
      rawRows.push({
        '학년': s.grade || '',
        '이름': s.label,
        '상태': status,
        '출석시각': presentFinal ? (result.time || '') : '',
        '시간반': presentFinal ? (result.timeband || '미기록') : '',
        '비고': (!scheduled && presentFinal) ? '보강(비정규 등원)' : '',
        '아버님': formatPhoneLabel(s.fatherName, s.fatherPhone),
        '어머님': formatPhoneLabel(s.motherName, s.motherPhone),
        _leave: result.isLeave,
      });
    });
    rawRows.sort((a, b) => (a['학년'].localeCompare(b['학년'])) || a['이름'].localeCompare(b['이름']));
    const rows = rawRows.map(({ _leave, ...rest }) => rest);
    const colCount = 8;
    const ws = XLSX.utils.json_to_sheet(rows, { origin: 'A2' });
    const title = `정도태권도 ${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일(${wk}) 일일출결표`;
    XLSX.utils.sheet_add_aoa(ws, [[title]], { origin: 'A1' });
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: colCount - 1 } }];
    ws['!cols'] = [{ wch: 7 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 8 }, { wch: 16 }, { wch: 20 }, { wch: 20 }];
    applyTableStyle(ws, { titleRows: 1 });
    rawRows.forEach((r, i) => { if (r._leave) { for (let c = 0; c < colCount; c++) applyRedCellStyle(ws, 2 + i, c); } });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '일일출결표');
    XLSX.writeFile(wb, `일일출결표_${dk}.xlsx`);
  }, [students, metaOf, todayAttendance, todayManualForDate, todayKey, closures, enrollments, absences, now]);

  // ---- 주간/월간 출결표 (조회 미리보기) ----
  const runReport = useCallback(async () => {
    setReportLoading(true);
    const result = await computeSummaryRows({ mode: reportMode, anchorStr: reportAnchor, meta, closures, enrollments, absences, now, todayAttendance, todayKey, students });
    setReportRows(result);
    setReportLoading(false);
  }, [reportAnchor, reportMode, meta, closures, enrollments, absences, now, todayAttendance, todayKey, students]);

  // ---- 기존 "엑셀로 저장" 버튼: 조회된 미리보기(reportRows)를 그대로 내보냄 (기존 동작 그대로 유지) ----
  const exportReport = useCallback(() => {
    if (!reportRows) return;
    writeSummaryWorkbook(reportMode, reportRows.rows, reportRows.periodStart, reportRows.periodEnd);
  }, [reportRows, reportMode]);

  // ---- 신규 "주간 요약표 저장" / "월간 요약표 저장" 버튼: 조회(미리보기) 없이 바로 계산+저장 ----
  const exportSummaryStandalone = useCallback(async (mode) => {
    if (exportBusy) return;
    setExportBusy(true);
    try {
      const result = await computeSummaryRows({ mode, anchorStr: reportAnchor, meta, closures, enrollments, absences, now, todayAttendance, todayKey, students });
      if (!result.rows.length) {
        setToast('저장할 출석 데이터가 없습니다');
      } else {
        writeSummaryWorkbook(mode, result.rows, result.periodStart, result.periodEnd);
        setToast(mode === 'week' ? '주간 요약표 저장 완료' : '월간 요약표 저장 완료');
      }
    } catch (e) {
      setToast('파일 생성 중 오류가 발생했습니다');
    } finally {
      setExportBusy(false);
      setTimeout(() => setToast(''), 2200);
    }
  }, [reportAnchor, meta, closures, enrollments, absences, now, todayAttendance, todayKey, exportBusy, students]);

  // ---- 신규 "주간 상세 출석부 저장" / "월간 상세 출석부 저장" 버튼 ----
  // mode를 인자로 직접 받으므로, 화면의 주간/월간 토글 상태와 무관하게
  // 항상 정확히 그 종류(주간 or 월간)의 상세 출석부를 만든다.
  const exportDetailedReport = useCallback(async (mode) => {
    if (exportBusy) return;
    setExportBusy(true);
    try {
      const anchor = new Date(reportAnchor + 'T00:00:00');
      const dateList = mode === 'week' ? getWeekDateList(anchor) : getMonthDateList(anchor);
      const periodStart = dateList[0];
      const periodEnd = dateList[dateList.length - 1];
      const today0 = startOfDay(now);

      // 기간 내 날짜별 출석 기록 일괄 로드 (오늘은 메모리 값 재사용, 미래는 빈 값)
      const attByDate = await loadAttendanceByDate(dateList, { todayKey, todayAttendance, today0 });
      // [수동 출결 수정 - Part 3] 수동 오버라이드는 단일 키(MANUAL_ATTENDANCE_KEY)에 전체 날짜가
      // 함께 저장되어 있으므로, 기간별로 개별 조회할 필요 없이 한 번만 통째로 불러와 날짜별로 슬라이스한다.
      const allManualAttendance = await loadAllManualAttendance();

      // 요일 스케줄이 설정된 학생만 포함 (기존 주간/월간 요약표와 동일한 대상 기준)
      const targetStudents = (students || []).filter(s => {
        const m = metaOf(s.id);
        return m.days && m.days.length > 0;
      }).sort((a, b) => (a.grade || '').localeCompare(b.grade || '') || a.name.localeCompare(b.name));

      if (targetStudents.length === 0) {
        setToast('저장할 출석 데이터가 없습니다');
        return;
      }

      // B2 이후 날짜 헤더: 월간은 '일(day)(요일)', 주간은 달이 걸칠 수 있어 'M/D(요일)'로 표기.
      // 토/일은 '토요일'/'일요일'로 풀어서 적고, 추석·설날 등 공휴일(휴관일)이면 그 이름을 줄바꿈으로 함께 적는다.
      const headerRow = mode === 'week'
        ? ['수련생이름', ...dateList.map(d => {
            const hm = dayHeaderMeta(d, closures);
            const base = `${d.getMonth() + 1}/${d.getDate()}(${hm.weekdayLabel})`;
            return hm.holidayLabel ? `${base}\n${hm.holidayLabel}` : base;
          })]
        : ['수련생이름', ...dateList.map(d => {
            const hm = dayHeaderMeta(d, closures);
            const base = `${d.getDate()}(${hm.weekdayLabel})`;
            return hm.holidayLabel ? `${base}\n${hm.holidayLabel}` : base;
          })];

      // A3 이후: 학생별 한 행, 각 날짜 칸에 정규화된 출결 표시 텍스트
      const leaveMatrix = []; // bodyRows와 같은 형태로 각 날짜 칸이 휴원인지 여부 (엑셀 빨간 셀 표시용)
      const bodyRows = targetStudents.map(s => {
        const studentMeta = metaOf(s.id);
        const leaveRow = [];
        const cells = dateList.map(d => {
          const dateStr = dateKey(d);
          const result = resolveDailyAttendance({
            studentId: s.id,
            dateStr,
            studentMeta,
            attendanceForDate: attByDate[dateStr],
            absences,
            closures,
            enrollments,
            manualForDate: allManualAttendance[dateStr],
            today0,
          });
          leaveRow.push(!!result.isLeave);
          return result.displayText; // 시간반/시각/출석/병결·여행·휴가/기타(상세)/휴원/결석/휴관/'' (해당없음)
        });
        leaveMatrix.push(leaveRow);
        return [s.label, ...cells];
      });

      let title, sheetName, fileTag;
      if (mode === 'week') {
        const y1 = periodStart.getFullYear();
        const y2 = periodEnd.getFullYear();
        const startLabel = `${y1}년 ${periodStart.getMonth() + 1}월 ${periodStart.getDate()}일`;
        const endLabel = (y1 === y2)
          ? `${periodEnd.getMonth() + 1}월 ${periodEnd.getDate()}일`
          : `${y2}년 ${periodEnd.getMonth() + 1}월 ${periodEnd.getDate()}일`;
        title = `정도태권도 ${startLabel} - ${endLabel} 출석부`;
        sheetName = '주간상세출석부';
        const fileStart = `${y1}년${periodStart.getMonth() + 1}월${periodStart.getDate()}일`;
        const fileEnd = (y1 === y2)
          ? `${periodEnd.getMonth() + 1}월${periodEnd.getDate()}일`
          : `${y2}년${periodEnd.getMonth() + 1}월${periodEnd.getDate()}일`;
        fileTag = `정도태권도_${fileStart}-${fileEnd}_주간상세출석부`;
      } else {
        title = `정도태권도 ${periodStart.getFullYear()}년 ${periodStart.getMonth() + 1}월 출석부`;
        sheetName = '월간상세출석부';
        fileTag = `정도태권도_${periodStart.getFullYear()}년${periodStart.getMonth() + 1}월_월간상세출석부`;
      }

      // 1행: 병합된 제목(A1~마지막 날짜 열, 수련생이름은 포함하지 않음)
      // 2행: A2=수련생이름 / B2~=날짜, 3행~: 학생별 출결 매트릭스
      const aoa = [
        [title, ...Array(dateList.length).fill('')],
        headerRow,
        ...bodyRows,
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: dateList.length } }]; // A1~마지막 날짜 열 병합
      ws['!cols'] = [{ wch: 14 }, ...dateList.map(() => ({ wch: 12 }))]; // 이름 열 + 날짜별 열 너비
      applyTableStyle(ws, { titleRows: 1 });
      // 주말(토/일)·공휴일/휴관일 열은 헤더부터 마지막 학생 행까지 통째로 배경 처리
      // (title행0, header행1 다음부터 데이터 시작 -> row offset 2)
      // 토요일은 하늘색, 일요일·공휴일·휴관일(평일 포함)은 연분홍으로 구분
      dateList.forEach((d, ci) => {
        const hm = dayHeaderMeta(d, closures);
        if (hm.isOff) {
          const styleFn = hm.isSaturday ? applySkyBlueCellStyle : applyRedCellStyle;
          styleFn(ws, 1, 1 + ci); // 헤더 행
          bodyRows.forEach((_, ri) => styleFn(ws, 2 + ri, 1 + ci));
        }
      });
      // 휴원 기간에 해당하는 칸은 그 위에 덧칠 (학생별 휴원 표시가 요일 배경보다 우선, 연분홍)
      leaveMatrix.forEach((rowFlags, ri) => {
        rowFlags.forEach((isLeave, ci) => { if (isLeave) applyRedCellStyle(ws, 2 + ri, 1 + ci); });
      });

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, `${fileTag}.xlsx`);

      setToast(mode === 'week' ? '주간 상세 출석부 저장 완료' : '월간 상세 출석부 저장 완료');
    } catch (e) {
      setToast('파일 생성 중 오류가 발생했습니다');
    } finally {
      setExportBusy(false);
      setTimeout(() => setToast(''), 2200);
    }
  }, [reportAnchor, metaOf, absences, closures, enrollments, todayAttendance, todayKey, now, exportBusy, students]);

  // ---- [원생별 출결 다운로드] 선택한 원생 × 선택한 연/월의 선택한 날짜들만 골라 상세 출석부를 저장 ----
  // 기존 exportDetailedReport와 동일하게 공용 resolveDailyAttendance / applyTableStyle 등을 재사용하며,
  // "요일 스케줄이 있는 학생만" 같은 자동 필터는 걸지 않고 화면에서 사용자가 직접 체크한 학생만 포함한다.
  // periods는 [{year, month}, ...] 형태로 여러 연도/월을 동시에 담을 수 있다.
  // 날짜는 개별로 빼지 않고 선택된 각 달의 실제 달력 날짜(1일 ~ 말일)를 모두 포함한다("월 단위" 내보내기).
  const exportSelectiveAttendance = useCallback(async (selectedIds, periods) => {
    if (exportBusy) return false;
    if (!selectedIds || selectedIds.length === 0) {
      setToast('원생을 1명 이상 선택해 주세요');
      setTimeout(() => setToast(''), 2200);
      return false;
    }
    // 같은 연/월이 중복으로 들어와도 한 번만 쓰도록 정리하고, 연도→월 순으로 정렬한다.
    const validPeriods = Array.from(
      new Map((periods || []).map(p => [`${p.year}-${p.month}`, { year: p.year, month: p.month }])).values()
    ).sort((a, b) => (a.year - b.year) || (a.month - b.month));
    if (validPeriods.length === 0) {
      setToast('연도/월을 1개 이상 선택해 주세요');
      setTimeout(() => setToast(''), 2200);
      return false;
    }
    setExportBusy(true);
    try {
      const dateList = [];
      validPeriods.forEach(({ year, month }) => {
        const daysInMonth = new Date(year, month, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) dateList.push(new Date(year, month - 1, day));
      });

      const today0 = startOfDay(now);
      const attByDate = await loadAttendanceByDate(dateList, { todayKey, todayAttendance, today0 });
      const allManualAttendance = await loadAllManualAttendance();

      const idSet = new Set(selectedIds);
      const targetStudents = (students || [])
        .filter(s => idSet.has(s.id))
        .sort((a, b) => (a.grade || '').localeCompare(b.grade || '') || a.name.localeCompare(b.name));

      if (targetStudents.length === 0) {
        setToast('선택한 원생을 찾을 수 없습니다');
        return false;
      }

      // 여러 연도가 섞여 선택된 경우에는 날짜 헤더에 연도(2자리)를 함께 표기해 구분한다.
      const multiYear = new Set(validPeriods.map(p => p.year)).size > 1;
      const headerRow = ['수련생이름', ...dateList.map(d => {
        const hm = dayHeaderMeta(d, closures);
        const yearPrefix = multiYear ? `${String(d.getFullYear()).slice(2)}.` : '';
        const base = `${yearPrefix}${d.getMonth() + 1}/${d.getDate()}(${hm.weekdayLabel})`;
        return hm.holidayLabel ? `${base}\n${hm.holidayLabel}` : base;
      })];

      const leaveMatrix = [];
      const bodyRows = targetStudents.map(s => {
        const studentMeta = metaOf(s.id);
        const leaveRow = [];
        const cells = dateList.map(d => {
          const dateStr = dateKey(d);
          const result = resolveDailyAttendance({
            studentId: s.id,
            dateStr,
            studentMeta,
            attendanceForDate: attByDate[dateStr],
            absences, closures, enrollments,
            manualForDate: allManualAttendance[dateStr],
            today0,
          });
          leaveRow.push(!!result.isLeave);
          return result.displayText; // 시간반/시각/출석/병결·여행·휴가/기타(상세)/휴원/미등원/결석/휴관/'' (해당없음)
        });
        leaveMatrix.push(leaveRow);
        return [s.label, ...cells];
      });

      const periodsLabel = formatSelectivePeriodsLabel(validPeriods);
      const title = `정도태권도 ${periodsLabel} 원생별 출결 다운로드`;
      const sheetName = '원생별출결다운로드';
      const fileTag = `정도태권도_${periodsLabel.replace(/[\s,·]/g, '')}_원생별출결다운로드`;

      const aoa = [
        [title, ...Array(dateList.length).fill('')],
        headerRow,
        ...bodyRows,
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: dateList.length } }];
      ws['!cols'] = [{ wch: 14 }, ...dateList.map(() => ({ wch: 12 }))];
      applyTableStyle(ws, { titleRows: 1 });
      dateList.forEach((d, ci) => {
        const hm = dayHeaderMeta(d, closures);
        if (hm.isOff) {
          const styleFn = hm.isSaturday ? applySkyBlueCellStyle : applyRedCellStyle;
          styleFn(ws, 1, 1 + ci);
          bodyRows.forEach((_, ri) => styleFn(ws, 2 + ri, 1 + ci));
        }
      });
      leaveMatrix.forEach((rowFlags, ri) => {
        rowFlags.forEach((isLeave, ci) => { if (isLeave) applyRedCellStyle(ws, 2 + ri, 1 + ci); });
      });

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, `${fileTag}.xlsx`);

      setToast('원생별 출결 다운로드 완료');
      return true;
    } catch (e) {
      setToast('파일 생성 중 오류가 발생했습니다');
      return false;
    } finally {
      setExportBusy(false);
      setTimeout(() => setToast(''), 2200);
    }
  }, [students, metaOf, absences, closures, enrollments, todayAttendance, todayKey, now, exportBusy]);

  // ---- [개인 출석부 - 달력형식 다운로드] 원생 1명 × 선택한 연/월의 출석 기록을 연도별로 시트 1개씩 만들어
  // 하나의 엑셀 파일로 저장한다. 한 시트 안에는 그 해에 선택된 달의 "달력 모양" 표가 1월→2월→…
  // 순서로 3줄씩 띄워 세로로 이어붙여진다(예: 2023년 1~12월 선택 → "2023년" 시트 1개 안에 달력 12개,
  // 2023·2024년 전체 선택 → "2023년"/"2024년" 시트 2개, 각 시트 안에 달력 12개씩).
  // 표 형식(원생별 출결 다운로드)과 달리 실제 달력처럼 일~토 7칸 × 주차별 행으로 배치하고,
  // 각 날짜 칸에는 "날짜\n출결내용(시간반 등)"을 함께 표기한다.
  const exportPersonalCalendarAttendance = useCallback(async (studentId, periods) => {
    if (exportBusy) return false;
    if (!studentId) {
      setToast('원생을 1명 선택해 주세요');
      setTimeout(() => setToast(''), 2200);
      return false;
    }
    const validPeriods = Array.from(
      new Map((periods || []).map(p => [`${p.year}-${p.month}`, { year: p.year, month: p.month }])).values()
    ).sort((a, b) => (a.year - b.year) || (a.month - b.month));
    if (validPeriods.length === 0) {
      setToast('연도/월을 1개 이상 선택해 주세요');
      setTimeout(() => setToast(''), 2200);
      return false;
    }
    const student = (students || []).find(s => s.id === studentId);
    if (!student) {
      setToast('선택한 원생을 찾을 수 없습니다');
      return false;
    }
    setExportBusy(true);
    try {
      const dateList = [];
      validPeriods.forEach(({ year, month }) => {
        const daysInMonth = new Date(year, month, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) dateList.push(new Date(year, month - 1, day));
      });
      const today0 = startOfDay(now);
      const attByDate = await loadAttendanceByDate(dateList, { todayKey, todayAttendance, today0 });
      const allManualAttendance = await loadAllManualAttendance();
      const studentMeta = metaOf(student.id);

      const wb = XLSX.utils.book_new();
      const usedSheetNames = new Set();

      // 연도별로 묶어서 한 시트 안에 1월 달력 → (빈 줄 3개) → 2월 달력 → … 순서로 세로로 쌓는다.
      const byYear = new Map();
      validPeriods.forEach(({ year, month }) => {
        if (!byYear.has(year)) byYear.set(year, []);
        byYear.get(year).push(month);
      });
      const years = Array.from(byYear.keys()).sort((a, b) => a - b);

      years.forEach(year => {
        const months = byYear.get(year).sort((a, b) => a - b);
        const aoa = [];
        const rowHeights = [];
        const merges = []; // 월 제목 가로 병합
        const titleRows = []; // 제목(굵게) 처리할 행 번호
        const colorJobs = []; // {row, col, isSaturday} 빨강/하늘색 처리
        const gapRows = []; // 빈 줄(테두리 없이 비워둘 행)

        months.forEach((month, mi) => {
          if (mi > 0) {
            for (let i = 0; i < 3; i++) { gapRows.push(aoa.length); aoa.push(['', '', '', '', '', '', '']); rowHeights.push({ hpt: 8 }); }
          }

          const titleRow = aoa.length;
          titleRows.push(titleRow);
          aoa.push([`${student.label} ${year}년 ${month}월 개인 출석부`, '', '', '', '', '', '']);
          rowHeights.push({ hpt: 22 });
          merges.push({ s: { r: titleRow, c: 0 }, e: { r: titleRow, c: 6 } });

          const headerRow = aoa.length;
          aoa.push(['일', '월', '화', '수', '목', '금', '토']);
          rowHeights.push({ hpt: 18 });
          colorJobs.push({ row: headerRow, col: 0, isSaturday: false });
          colorJobs.push({ row: headerRow, col: 6, isSaturday: true });

          const daysInMonth = new Date(year, month, 0).getDate();
          const leadPad = new Date(year, month - 1, 1).getDay(); // 0(일)~6(토)
          const dayCells = [];
          for (let i = 0; i < leadPad; i++) dayCells.push(null);
          for (let day = 1; day <= daysInMonth; day++) dayCells.push(day);
          while (dayCells.length % 7 !== 0) dayCells.push(null);

          for (let i = 0; i < dayCells.length; i += 7) {
            const rowDays = dayCells.slice(i, i + 7);
            const weekRowIdx = aoa.length;
            const rowCells = rowDays.map((day, ci) => {
              if (day == null) return '';
              const d = new Date(year, month - 1, day);
              const dateStr = dateKey(d);
              const result = resolveDailyAttendance({
                studentId: student.id, dateStr, studentMeta,
                attendanceForDate: attByDate[dateStr],
                absences, closures, enrollments,
                manualForDate: allManualAttendance[dateStr],
                today0,
              });
              const hm = dayHeaderMeta(d, closures);
              if (ci === 0 || ci === 6 || hm.isOff) colorJobs.push({ row: weekRowIdx, col: ci, isSaturday: hm.isSaturday });
              return result.displayText ? `${day}\n${result.displayText}` : `${day}`;
            });
            aoa.push(rowCells);
            rowHeights.push({ hpt: 36 });
          }
        });

        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!merges'] = merges;
        ws['!cols'] = Array.from({ length: 7 }, () => ({ wch: 13 }));
        ws['!rows'] = rowHeights;
        applyTableStyle(ws, { titleRows: 0 }); // 표 전체에 테두리/정렬을 먼저 입힌 뒤,
        const gapRowSet = new Set(gapRows);
        gapRowSet.forEach(r => { // 월 사이 빈 줄은 테두리 없이 비워둔다.
          for (let c = 0; c < 7; c++) {
            const addr = XLSX.utils.encode_cell({ r, c });
            ws[addr] = { t: 's', v: '' };
          }
        });
        titleRows.forEach(r => { // 각 월 제목 행만 굵게+큰 글씨로.
          for (let c = 0; c < 7; c++) {
            const addr = XLSX.utils.encode_cell({ r, c });
            if (!ws[addr]) ws[addr] = { t: 's', v: '' };
            ws[addr].s = { ...(ws[addr].s || {}), font: { bold: true, sz: 14 } };
          }
        });
        colorJobs.forEach(({ row, col, isSaturday }) => {
          const styleFn = isSaturday ? applySkyBlueCellStyle : applyRedCellStyle;
          styleFn(ws, row, col);
        });

        let sheetName = `${year}년`;
        if (usedSheetNames.has(sheetName)) sheetName = `${sheetName}_${usedSheetNames.size}`;
        usedSheetNames.add(sheetName);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });

      const periodsLabel = formatSelectivePeriodsLabel(validPeriods);
      const fileTag = `${student.label}_개인출석부_${periodsLabel}`.replace(/[\s,·]/g, '');
      XLSX.writeFile(wb, `${fileTag}.xlsx`);

      setToast('개인 출석부 다운로드 완료');
      return true;
    } catch (e) {
      setToast('파일 생성 중 오류가 발생했습니다');
      return false;
    } finally {
      setExportBusy(false);
      setTimeout(() => setToast(''), 2200);
    }
  }, [students, metaOf, absences, closures, enrollments, todayAttendance, todayKey, now, exportBusy]);

  useEffect(() => { setReportRows(null); }, [reportMode, reportAnchor]);

  if (!meta || !students) {
    return <div style={S.loadingWrap}><div style={S.loadingText}>불러오는 중…</div></div>;
  }

  return (
    <div style={S.app}>
      <style>{GLOBAL_CSS}</style>
      <header style={S.header}>
        <div style={S.headerTop}>
          <div style={S.dojangMark}>道</div>
          <div style={{ flex: 1 }}>
            <div style={S.title}>{now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일 출석체크</div>
            <div style={S.subtitle}>({weekdayKrOf(now)}) {pad2(now.getHours())}:{pad2(now.getMinutes())}</div>
          </div>
          {todayOff.type === 'holiday' ? (
            <div style={S.holidayTag}>공휴일</div>
          ) : (
            <button style={{ ...S.closureBtn, ...(todayOff.off ? S.closureBtnActive : {}) }}
              onClick={() => setClosureModalOpen(true)}>
              {todayOff.off ? `휴관중` : '휴관처리'}
            </button>
          )}
        </div>
        {todayOff.off && (
          <div style={S.holidayBanner}>오늘은 {todayOff.label}이에요 · 정상 결석 처리 없이 출석체크만 가능해요</div>
        )}
      </header>

      <main style={S.main}>
        {tab === 'check' && (
          <CheckTab
            selectedBand={selectedBand} setSelectedBand={setSelectedBand}
            selectedGrade={selectedGrade} setSelectedGrade={setSelectedGrade}
            selectedCho={selectedCho} setSelectedCho={setSelectedCho}
            checkList={checkList} checkedInList={checkedInList}
            metaOf={metaOf} onCheckIn={checkIn} onUndo={undoCheckIn}
            todayCount={checkedInList.length}
            onShareAttendance={shareTodayAttendance}
          />
        )}
        {tab === 'absent' && (
          <AbsentTab
            absentToday={absentToday} metaOf={metaOf}
            absenceRegisteredToday={absenceRegisteredToday}
            reportDailyDate={reportDailyDate} setReportDailyDate={setReportDailyDate}
            onExportDaily={exportDaily} todayWeekday={todayWeekday} todayOff={todayOff}
            closures={closures} onToggleClosure={toggleClosure}
            onOpenAbsenceModal={(s) => { setAbsenceModalStudent(s); setAbsenceEditRecord(null); }}
            onEditAbsence={(s, rec) => { setAbsenceModalStudent(s); setAbsenceEditRecord(rec); }}
            onRemoveAbsence={removeAbsence}
            onEditManual={openManualEditForToday}
            onRemoveManual={removeManualToday}
            onShareAbsent={shareAbsentToday}
            onShareFullBackup={shareFullBackup}
            onImportFullBackup={importFullBackup}
            onDownloadBackupJSON={downloadFullBackupJSON}
            onImportBackupFile={importFullBackupFromFile}
          />
        )}
        {tab === 'settings' && (
          <SettingsTab
            students={students}
            meta={meta} metaOf={metaOf} onUpdate={updateStudentMeta}
            search={settingsSearch} setSearch={setSettingsSearch}
            cho={settingsCho} setCho={setSettingsCho}
            gradeFilter={settingsGrade} setGradeFilter={setSettingsGrade}
            onOpenAbsenceModal={(s) => { setAbsenceModalStudent(s); setAbsenceEditRecord(null); }}
            onOpenAddStudent={() => setStudentModal('new')}
            onOpenEditStudent={(s) => setStudentModal(s)}
            onDeleteStudent={deleteStudent}
            enrollments={enrollments}
            onOpenEnrollmentModal={setEnrollmentModalStudent}
            onReleaseEnrollment={releaseEnrollment}
          />
        )}
        {tab === 'report' && (
          <ReportTab
            reportMode={reportMode} setReportMode={setReportMode}
            reportAnchor={reportAnchor} setReportAnchor={setReportAnchor}
            reportRows={reportRows} onRun={runReport} loading={reportLoading}
            onExport={exportReport}
            onExportSummary={exportSummaryStandalone}
            onExportDetailed={exportDetailedReport}
            exportBusy={exportBusy}
          />
        )}
        {tab === 'manual' && (
          <ManualEditTab
            manualEditDate={manualEditDate} setManualEditDate={setManualEditDate}
            resolvedList={manualResolvedList}
            search={manualSearch} setSearch={setManualSearch}
            gradeFilter={manualGradeFilter} setGradeFilter={setManualGradeFilter}
            statusFilter={manualStatusFilter} setStatusFilter={setManualStatusFilter}
            selectedIds={manualSelectedIds} setSelectedIds={setManualSelectedIds}
            onOpenEdit={(s) => setManualEditingStudent(s)}
            onBulkAction={(status) => setManualBulkStatus(status)}
          />
        )}
        {tab === 'selective' && (
          <SelectiveExportTab
            students={students}
            search={selectiveSearch} setSearch={setSelectiveSearch}
            selectedIds={selectiveSelectedIds} setSelectedIds={setSelectiveSelectedIds}
            periods={selectivePeriods} setPeriods={setSelectivePeriods}
            onExport={exportSelectiveAttendance}
            exportBusy={exportBusy}
          />
        )}
        {tab === 'personal' && (
          <PersonalCalendarTab
            students={students}
            search={personalSearch} setSearch={setPersonalSearch}
            selectedId={personalSelectedId} setSelectedId={setPersonalSelectedId}
            periods={personalPeriods} setPeriods={setPersonalPeriods}
            onExport={exportPersonalCalendarAttendance}
            exportBusy={exportBusy}
          />
        )}
      </main>

      {toast && <div style={S.toast}>{toast}</div>}
      {saveError && <div style={S.errorBanner} onClick={() => setSaveError('')}>{saveError} (닫기)</div>}

      {absenceModalStudent && (
        <AbsenceModal
          student={absenceModalStudent}
          editRecord={absenceEditRecord}
          onClose={() => { setAbsenceModalStudent(null); setAbsenceEditRecord(null); }}
          onConfirm={addAbsence}
        />
      )}

      {enrollmentModalStudent && (
        <EnrollmentModal
          student={enrollmentModalStudent}
          onClose={() => setEnrollmentModalStudent(null)}
          onConfirm={setEnrollmentLeave}
        />
      )}

      {closureModalOpen && (
        <ClosureModal
          closures={closures}
          initialMonth={now}
          onClose={() => setClosureModalOpen(false)}
          onApply={applyClosures}
          onUpdateReason={setClosureLabel}
          onRemove={removeClosureDate}
        />
      )}

      {studentModal && (
        <StudentFormModal
          student={studentModal === 'new' ? null : studentModal}
          onClose={() => setStudentModal(null)}
          onSave={handleSaveStudent}
        />
      )}

      {manualEditingStudent && (
        <ManualEditModal
          student={manualEditingStudent}
          dateStr={manualEditDate}
          currentRecord={manualEditModalCurrentRecord}
          resolvedResult={manualEditModalResolvedResult}
          onClose={() => setManualEditingStudent(null)}
          onSave={(payload) => {
            setManualAttendance(manualEditingStudent.id, manualEditDate, payload);
            setManualEditingStudent(null);
            setToast(`${manualEditingStudent.label} ${MANUAL_EDIT_STATUS_LABEL[payload.status] || ''} 저장 완료`);
            setTimeout(() => setToast(''), 2200);
          }}
          onClear={() => {
            clearManualAttendance(manualEditingStudent.id, manualEditDate);
            setManualEditingStudent(null);
            setToast(`${manualEditingStudent.label} 수동 수정 기록을 지웠어요`);
            setTimeout(() => setToast(''), 2200);
          }}
        />
      )}

      {manualBulkStatus && (
        <BulkManualEditModal
          status={manualBulkStatus}
          selectedCount={manualSelectedIds.length}
          onClose={() => setManualBulkStatus(null)}
          onConfirm={applyManualAttendanceBulk}
        />
      )}

      <nav style={S.nav}>
        <NavBtn active={tab === 'check'} onClick={() => setTab('check')} label="출석체크" icon="✓" />
        <NavBtn active={tab === 'absent'} onClick={() => setTab('absent')} label="결석·연락" icon="☎" badge={absentToday.length} />
        <NavBtn active={tab === 'settings'} onClick={() => setTab('settings')} label="원생설정" icon="⚙" />
        <NavBtn active={tab === 'report'} onClick={() => setTab('report')} label="출결표" icon="▤" />
        <NavBtn active={tab === 'manual'} onClick={() => setTab('manual')} label="날짜별 수정" icon="✎" />
        <NavBtn active={tab === 'selective'} onClick={() => setTab('selective')} label="원생별 출결 다운로드" icon="⬇" />
        <NavBtn active={tab === 'personal'} onClick={() => setTab('personal')} label="개인 출석부" icon="📅" />
      </nav>
    </div>
  );
}

/* ========================= 하위 컴포넌트 ========================= */
function NavBtn({ active, onClick, label, icon, badge }) {

    <button onClick={onClick} style={{ ...S.navBtn, ...(active ? S.navBtnActive : {}) }}>
      <div style={S.navIconWrap}>
        <span style={S.navIcon}>{icon}</span>
        {!!badge && <span style={S.navBadge}>{badge}</span>}
      </div>
      <span>{label}</span>
    </button>
  );
}

function CheckTab({ selectedBand, setSelectedBand, selectedGrade, setSelectedGrade, selectedCho, setSelectedCho, checkList, checkedInList, metaOf, onCheckIn, onUndo, todayCount, onShareAttendance }) {
  const [showCheckedIn, setShowCheckedIn] = useState(false);
  const [bandWarning, setBandWarning] = useState(false);
  const [confirmStudent, setConfirmStudent] = useState(null); // 이름을 눌렀을 때 "출석 확인" 팝업을 띄울 대상 학생
  const hasPrimaryFilter = !!selectedGrade;

  const handleCheckIn = (s) => {
    if (!selectedBand) { setBandWarning(true); return; }
    setBandWarning(false);
    setConfirmStudent(s);
  };

  const confirmCheckIn = () => {
    if (confirmStudent) onCheckIn(confirmStudent.id, confirmStudent.label, selectedBand);
    setConfirmStudent(null);
  };

  return (
    <div>
      <Section title="① 지금 시간반 선택 (출석 기록용)">
        <div style={S.bandGrid}>
          {TIMEBANDS.map(b => (
            <button key={b} onClick={() => { setSelectedBand(selectedBand === b ? '' : b); setBandWarning(false); }}
              style={{ ...S.bandBtn, ...(selectedBand === b ? S.bandBtnActive : {}) }}>{b}</button>
          ))}
        </div>
        <div style={S.hint}>지금 등원한 시간반을 선택하면, 이름을 눌러 출석시킬 때 그 시간반이 함께 기록돼요. 필터링에는 쓰이지 않아요.</div>
      </Section>

      <Section title="② 학년으로 찾기">
        <div style={S.gradeGrid}>
          {GRADES.map(g => (
            <button key={g} onClick={() => setSelectedGrade(selectedGrade === g ? '' : g)}
              style={{ ...S.gradeBtn, ...(selectedGrade === g ? S.gradeBtnActive : {}) }}>{g}</button>
          ))}
        </div>
      </Section>

      <Section title="③ 초성으로 찾기 (선택)">
        <div style={S.choGrid}>
          {BASE14.map(c => (
            <button key={c} onClick={() => setSelectedCho(selectedCho === c ? '' : c)}
              style={{ ...S.choBtn, ...(selectedCho === c ? S.choBtnActive : {}) }}>{c}</button>
          ))}
        </div>
      </Section>

      <Section title={`④ 이름을 누르면 출석 완료 (미출석 ${checkList.length}명)`}>
        {!hasPrimaryFilter ? (
          <div style={S.hint}>먼저 학년(또는 유치부)을 선택해주세요.</div>
        ) : checkList.length === 0 ? (
          <div style={S.hint}>해당 조건의 미출석 학생이 없어요.</div>
        ) : (
          <>
            {bandWarning && <div style={{ ...S.hint, color: '#C1443C' }}>⚠ 시간반을 먼저 선택해주세요.</div>}
            <div style={S.nameGrid}>
              {checkList.map(s => (
                <button key={s.id} onClick={() => handleCheckIn(s)} style={S.nameBtn}>
                  <div style={S.nameBtnName}>{s.label}</div>
                  <div style={S.nameBtnBand}>{s.grade || '학년미상'}</div>
                </button>
              ))}
            </div>
          </>
        )}
      </Section>

      <Section title={`오늘 출석 완료 (${todayCount}명)`}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <button style={S.linkBtn} onClick={() => setShowCheckedIn(v => !v)}>
            {showCheckedIn ? '접기 ▲' : '목록 보기 ▼'}
          </button>
          <button style={S.shareBtn} onClick={onShareAttendance}>💬 카톡으로 공유</button>
        </div>
        {showCheckedIn && (
          <div style={S.checkedInList}>
            {checkedInList.length === 0 && <div style={S.hint}>아직 출석한 학생이 없어요.</div>}
            {checkedInList.map(c => (
              <div key={c.id} style={S.checkedInRow}>
                <span>{c.label} <span style={S.checkedInTime}>{c.time}{c.timeband ? ' · ' + c.timeband : ''}</span></span>
                <button style={S.undoBtn} onClick={() => onUndo(c.id)}>취소</button>
              </div>
            ))}
          </div>
        )}
      </Section>

      {confirmStudent && (
        <div style={S.modalOverlay} onClick={() => setConfirmStudent(null)}>
          <div style={S.modalCard} onClick={e => e.stopPropagation()}>
            <div style={S.modalHeader}>
              <div style={S.modalTitle}>출석 확인</div>
              <button style={S.modalCloseBtn} onClick={() => setConfirmStudent(null)}>✕</button>
            </div>
            <div style={S.modalSubtitle}>{confirmStudent.label} 학생을 {selectedBand} 출석 처리할까요?</div>
            <div style={S.modalBtnRow}>
              <button style={S.modalCancelBtn} onClick={() => setConfirmStudent(null)}>취소</button>
