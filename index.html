function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function getMonday(d) { const x = startOfDay(d); const day = x.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(x, diff); }

function countScheduledOccurrences(days, start, end, closures) {
  if (!days || days.length === 0) return 0;
  let count = 0;
  let cur = startOfDay(start);
  const endD = startOfDay(end);
  if (cur > endD) return 0;
  while (cur <= endD) {
    if (days.includes(weekdayKrOf(cur)) && !dayOffInfo(dateKey(cur), closures).off) count++;
    cur = addDays(cur, 1);
  }

}

/* [원생별 출결 다운로드] 선택된 {year, month} 목록을 "2025년 11월 · 2026년 1월,2월,3월" 같은
 * 사람이 읽을 수 있는 문자열로 요약한다. 연도별로 묶고, 12개월이 모두 선택된 연도는 "OO년 전체"로 표시한다.
 * 엑셀 제목/시트명/파일명과 화면의 선택 요약 문구에서 공통으로 사용한다. */
function formatSelectivePeriodsLabel(periods) {
  if (!periods || periods.length === 0) return '';
  const byYear = {};
  periods.forEach(p => {
    if (!byYear[p.year]) byYear[p.year] = new Set();
    byYear[p.year].add(p.month);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
  const parts = years.map(y => {
    const months = Array.from(byYear[y]).sort((a, b) => a - b);
    if (months.length === 12) return `${y}년 전체`;
    return `${y}년 ${months.map(m => `${m}월`).join(',')}`;
  });
  return parts.join(' · ');
}
function dayOffInfo(dk, closures) {
  if (HOLIDAYS[dk]) return { off: true, label: HOLIDAYS[dk], type: 'holiday' };
  if (closures && closures[dk]) return { off: true, label: closures[dk], type: 'closure' };
  return { off: false, label: '', type: '' };
}

/**
 * 엑셀 출석부(상세/요약)의 날짜 헤더 표기에 쓰는 정보를 계산한다.
 * - 주말(토/일)은 약자(토/일) 대신 전체 명칭(토요일/일요일)으로 표기하고,
 * - 공휴일(추석/설날 등 HOLIDAYS)이나 원 사정 휴관일이면 그 사유를 헤더에 함께 적는다.
 * - isOff: 주말이거나 휴관/공휴일이면 true -> 엑셀에서 해당 날짜 열 전체를 빨간 배경으로 표시하는 데 쓰인다.
 */
function dayHeaderMeta(d, closures) {
  const dow = d.getDay(); // 0=일,6=토
  const isWeekend = dow === 0 || dow === 6;
  const off = dayOffInfo(dateKey(d), closures);
  const weekdayLabel = dow === 6 ? '토요일' : dow === 0 ? '일요일' : weekdayKrOf(d);
  return {
    isWeekend,
    isSaturday: dow === 6, // 토요일만 하늘색으로 구분 표시하기 위한 플래그
    isOff: isWeekend || off.off,
    holidayLabel: off.off ? off.label : null, // 예: '추석', '설날', '설날연휴' 등 (원 사정 휴관이면 해당 사유)
    weekdayLabel,

}

/**
 * 특정 날짜(dateStr)가 그 학생의 휴원 기간(현재 진행중이거나 과거에 종료된 기간)에
 * 포함되는지 확인한다. 포함되면 사유 정보를 담은 객체를, 아니면 null을 반환한다.
 * - 현재 진행중인 휴원(status==='leave')은 startDate 이후 전부(미래 포함, 해제 전까지) 대상.
 * - 이미 해제된(재원 처리된) 과거 휴원 기간은 history[]에 startDate~endDate로 기록되어,
 *   과거 날짜의 상세출석부/요약표를 다시 뽑아도 그 기간은 계속 '휴원'으로 표시된다.
 */
function leaveInfoForDate(studentId, dateStr, enrollments) {
  const rec = enrollments && enrollments[studentId];
  if (!rec) return null;
  if (rec.status === 'leave' && rec.startDate && dateStr >= rec.startDate) {
    return { reasonType: rec.reasonType, customReason: rec.customReason, startDate: rec.startDate, endDate: null };
  }
  if (Array.isArray(rec.history)) {
    for (const h of rec.history) {
      if (h.startDate && h.endDate && dateStr >= h.startDate && dateStr <= h.endDate) {
        return { reasonType: h.reasonType, customReason: h.customReason, startDate: h.startDate, endDate: h.endDate };
      }
    }
  }
  return null;
}

/* ========================= 스토리지 헬퍼 (IndexedDB 우선 + localStorage 이중 백업, 자동 재시도) =========================
 * 로그인/서버 없이, 순수 HTML 파일 그대로 "이 브라우저 안에서" 최대한 안 사라지게 저장하는 게 목표다.
 *   - 저장할 때마다 localStorage와 IndexedDB 양쪽에 모두 써서, 둘 중 하나만 성공해도 저장 성공으로 본다.
 *   - navigator.storage.persist()로 "영구 저장 허용"을 브라우저에 요청해서, 기기 저장공간이 부족할 때
 *     브라우저가 이 데이터를 자동으로 지워버리는(=자동 정리 대상이 되는) 상황을 최대한 막는다.
 *   - IndexedDB는 localStorage보다 저장 용량 한도가 훨씬 크고(보통 수백MB 이상) 여러 해 분량의 출석
 *     기록이 쌓여도 "저장공간 꽉 참" 문제가 사실상 생기지 않는다. 실패해도 최대 3번까지 자동 재시도한다.
 *   - 값을 읽을 때는 IndexedDB를 먼저 보고, 없으면 localStorage에서 찾아서 자동으로 IndexedDB에도
 *     복사해둔다(승격) - 예전 버전에서 저장된 데이터도 그대로 이어서 쓸 수 있다.
 *   - [자동 백업] 매일 첫 저장 시점에 전체 데이터를 .json 파일로 조용히 다운로드해서, 브라우저 저장공간이
 *     통째로 초기화되는 최악의 경우에도 폰 "다운로드" 폴더의 실제 파일로 복구할 수 있게 한다
 *     (버튼을 누르라고 안내하는 게 아니라, 저장할 때마다 자동으로 실행됨).
 * ===================================================================================== */

/** 브라우저에 "이 사이트 데이터는 저장공간 부족 시에도 자동으로 지우지 말아달라"고 요청한다.
 *  지원 안 하는 브라우저에서는 조용히 무시된다 - 실패해도 앱 동작에는 영향 없음. */
(function requestPersistentStorage() {
  try {
    if (navigator.storage && typeof navigator.storage.persist === 'function') {
      navigator.storage.persist().then((granted) => {
        console.log(granted ? '영구 저장 허용됨 (자동 정리 대상에서 제외)' : '영구 저장 허용 안 됨 (브라우저가 거부함 - 그래도 IndexedDB는 계속 사용)');
      }).catch(() => {});
    }
  } catch (e) {}
})();

const HAS_CLAUDE_STORAGE = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const IDB_DB_NAME = 'tkd-attendance-store';
const IDB_STORE_NAME = 'kv';
let _idbPromise = null;
function openIDB() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') { resolve(null); return; }
    let settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    try {
      const req = indexedDB.open(IDB_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME);
      };
      req.onsuccess = () => finish(req.result);
      req.onerror = () => finish(null);
      req.onblocked = () => finish(null);
      // 일부 환경(강력한 시크릿모드 등)에서 open()이 영영 응답하지 않는 경우를 대비한 안전장치.
      setTimeout(() => finish(null), 2500);
    } catch (e) { finish(null); }
  });
  return _idbPromise;
}
function idbGet(key) {
  return openIDB().then(db => new Promise((resolve) => {
    if (!db) { resolve(undefined); return; }
    try {
      const req = db.transaction(IDB_STORE_NAME, 'readonly').objectStore(IDB_STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(undefined);
    } catch (e) { resolve(undefined); }
  }));
}
function idbSet(key, value) {
  return openIDB().then(db => new Promise((resolve) => {
    if (!db) { resolve(false); return; }
    try {
      const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
      tx.objectStore(IDB_STORE_NAME).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
      tx.onabort = () => resolve(false);
    } catch (e) { resolve(false); }
  }));
}
function idbListKeys(prefix) {
  return openIDB().then(db => new Promise((resolve) => {
    if (!db) { resolve(null); return; }
    try {
      const req = db.transaction(IDB_STORE_NAME, 'readonly').objectStore(IDB_STORE_NAME).getAllKeys();
      req.onsuccess = () => resolve((req.result || []).filter(k => typeof k === 'string' && k.indexOf(prefix) === 0));
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  }));
}
async function withRetry(fn, tries, delayMs) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; if (i < tries - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
  }
  throw lastErr;
}

async function storageGetJSON(key) {
  if (HAS_CLAUDE_STORAGE) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
      return null;
    } catch (e) { console.error('storageGetJSON(window.storage) 실패:', key, e && e.message); return null; }
  }
  try {
    const v = await idbGet(key);
    if (v !== undefined) return v;
  } catch (e) { console.warn('IndexedDB 읽기 실패, localStorage로 대체:', key, e && e.message); }
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return null;
    const parsed = JSON.parse(raw);
    idbSet(key, parsed).catch(() => {}); // 다음부터는 IndexedDB에서 바로 읽히도록 백그라운드로 승격 저장(실패해도 무시)
    return parsed;
  } catch (e) { console.error('storageGetJSON 완전 실패:', key, e && e.name, e && e.message); return null; }
}

async function storageSetJSON(key, obj) {
  if (HAS_CLAUDE_STORAGE) {
    try { await window.storage.set(key, JSON.stringify(obj), false); return true; }
    catch (e) { console.error('storageSetJSON(window.storage) 실패:', key, e && e.message); return false; }
  }
  const json = JSON.stringify(obj);
  let localOk = false;
  try { localStorage.setItem(key, json); localOk = true; }
  catch (e) { console.warn('localStorage 저장 실패(IndexedDB로 계속 시도):', key, e && e.name); }

  let idbOk = false;
  try {
    idbOk = await withRetry(async () => {
      const ok = await idbSet(key, obj);
      if (!ok) throw new Error('idb put 실패');
      return true;
    }, 3, 250);
  } catch (e) {
    console.warn('IndexedDB 저장 실패(3회 재시도 후 포기):', key, e && e.message);
  }

  if (localOk || idbOk) return true; // 둘 중 하나라도 성공하면 저장 성공으로 처리 - 사용자에게 실패로 안 보이게 함
  console.error('storageSetJSON 완전 실패 - localStorage/IndexedDB 둘 다 안 됨:', key);
  return false;
}

/** prefix로 시작하는 모든 저장 키 목록을 반환한다 (예: 'att-' -> 지금까지 출석 기록이 있는 모든 날짜 키). */
async function storageListKeys(prefix) {
  if (HAS_CLAUDE_STORAGE && typeof window.storage.list === 'function') {
    try {
      const res = await window.storage.list(prefix, false);
      return (res && res.keys) || [];
    } catch (e) { console.error('storageListKeys(window.storage) 실패:', prefix, e && e.message); return []; }
  }
  const result = new Set();
  try {
    const idbKeys = await idbListKeys(prefix);
    if (idbKeys) idbKeys.forEach(k => result.add(k));
  } catch (e) {}
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) result.add(k);
    }
  } catch (e) {}
  return Array.from(result);
}

/* ---- [신규] 자동 파일 백업 - 하루 첫 저장 시점에 전체 데이터를 .json으로 조용히 다운로드 ----
 * 브라우저 저장공간(localStorage/IndexedDB)이 통째로 날아가는 최악의 상황에도, 폰의 실제
 * "다운로드" 폴더에 최근 백업 파일이 남아있도록 한다. 버튼을 누르라고 안내하는 게 아니라
 * 저장이 실제로 발생할 때 자동으로 실행되며, 하루 1회로 제한해 파일이 너무 많이 쌓이지 않게 한다. */
const AUTO_BACKUP_DATE_KEY = 'auto-backup-last-date';
let _autoBackupInFlight = false;
async function maybeAutoBackupToFile(buildFullBackupPayloadFn) {
  if (_autoBackupInFlight) return;
  _autoBackupInFlight = true;
  try {
    const today = dateKey(new Date());
    const lastRaw = await storageGetJSON(AUTO_BACKUP_DATE_KEY);
    const last = (lastRaw && typeof lastRaw === 'object') ? lastRaw.date : lastRaw;
    if (last === today) return; // 오늘 이미 백업함
    const payload = await buildFullBackupPayloadFn();
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `정도태권도_자동백업_${today}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    await storageSetJSON(AUTO_BACKUP_DATE_KEY, { date: today });
  } catch (e) {
    console.warn('자동 백업 실패(다음 저장 시 재시도됨):', e && e.message);
  } finally {
    _autoBackupInFlight = false;
  }
}

/* =========================================================================
 * 상세 출석부 헬퍼 (Part 1)
 * -------------------------------------------------------------------------
 * NOTE (English): These helpers compute a normalized per-student/per-date
 * attendance result by reading the SAME existing data sources the app
 * already uses (att-YYYY-MM-DD records, the `absences` object, `closures`,
 * and each student's weekday schedule in `meta`). No new storage keys are
 * introduced and no existing data is migrated or deleted. They are pure
 * functions (no React state), so they can be reused by both the existing
 * weekly/monthly summary report AND the future detailed Excel export
 * without duplicating logic.
 * ========================================================================= */

// REASON_OPTIONS의 key -> 한글 라벨 매핑 (예: 'sick' -> '병결')
const REASON_LABEL_BY_KEY = REASON_OPTIONS.reduce((acc, opt) => { acc[opt.key] = opt.label; return acc; }, {});

/**
 * 한 학생의 결석 등록 기록(absences) 중 주어진 날짜(dateStr, 'YYYY-MM-DD')에
 * 적용되는 기록을 찾는다.
 *
 * 기존 absences 구조 그대로 사용 (신규 스토리지 없음):
 *   { [absenceId]: { studentId, startDate, endDate, reasonType, customReason, createdAt } }
 *   - startDate/endDate: 'YYYY-MM-DD' 문자열, 둘 다 포함(inclusive)하는 날짜 범위.
 *     단일일 결석은 startDate === endDate로 등록됨 (AbsenceModal 기본값 확인).
 *   - reasonType: REASON_OPTIONS의 key ('sick' | 'travel' | 'vacation' | 'other')
 *   - customReason: reasonType이 'other'일 때만 값이 채워짐.
 *
 * 같은 학생/날짜에 여러 결석 기록이 겹치면 createdAt이 가장 최근인 것을 우선한다.
 * (English: if multiple absence records overlap the same date, the most
 * recently created one wins — an assumption, since the current UI has no
 * overlap-prevention logic.)
 */
function findAbsenceForDate(studentId, dateStr, absences) {
  if (!absences) return null;
  let best = null;
  Object.keys(absences).forEach(id => {
    const rec = absences[id];
    if (!rec || rec.studentId !== studentId) return;
    if (!rec.startDate || !rec.endDate) return;
    if (dateStr < rec.startDate || dateStr > rec.endDate) return;
    if (!best || (rec.createdAt || '') >= (best.createdAt || '')) best = rec;
  });
  return best;
}

/**
 * 결석 사유의 최종 표시 텍스트를 만든다.
 *   병결/여행/휴가 -> 라벨 그대로
 *   기타 + 상세내용 있음 -> '기타(상세내용)' (예: 기타(가족 행사))
 *   기타 + 상세내용 없음 -> '기타'
 */
function absenceReasonDisplayText(rec) {
  if (!rec) return '';
  const label = REASON_LABEL_BY_KEY[rec.reasonType] || rec.reasonType || '';
  if (rec.reasonType === 'other' && rec.customReason && rec.customReason.trim()) {
    return `${label}(${rec.customReason.trim()})`;
  }
  return label;
}

/** 휴원 표시 텍스트: '휴원(병결)' / '휴원(기타:상세사유)' / 사유 없으면 '휴원' */
function leaveReasonDisplayText(rec) {
  if (!rec) return '휴원';
  const label = REASON_LABEL_BY_KEY[rec.reasonType] || rec.reasonType || '';
  if (!label) return '휴원';
  if (rec.reasonType === 'other' && rec.customReason && rec.customReason.trim()) {
    return `휴원(${label}:${rec.customReason.trim()})`;
  }
  return `휴원(${label})`;
}

/**
 * [수동 출결 수정 - Part 2] 한 학생의 특정 날짜에 대한 수동 오버라이드 기록을 찾는다.
 * manualForDate는 loadManualAttendanceForDate(dateStr) 결과 ({ [studentId]: {...} } 형태) 그대로 넘기면 된다.
 */
function manualOverrideForDate(studentId, manualForDate) {
  if (!manualForDate) return null;
  return manualForDate[studentId] || null;
}

/* =========================================================================
 * [수동 출결 수정 - Part 2] 데이터 레이어
 * -------------------------------------------------------------------------
 * 아래 함수들은 MANUAL_ATTENDANCE_KEY(단일 키) 하나만 읽고 쓴다.
 * 기존 att-YYYY-MM-DD / absences / closures / enrollments / students-* 키는
 * 이 함수들 안에서 절대 읽거나 쓰지 않으며, 어떤 마이그레이션도 수행하지 않는다.
 * 아직 UI에는 연결하지 않는다 (다음 단계에서 연결 예정) - 여기서는 저장소 계층과
 * 재사용 가능한 순수 함수만 준비한다.
 * ========================================================================= */

/**
 * 1) 모든 날짜의 수동 출결 데이터를 통째로 불러온다.
 * @returns {Promise<Object.<string, Object.<string, object>>>} 저장된 값이 없으면 빈 객체 {}
 */
async function loadAllManualAttendance() {
  const loaded = await storageGetJSON(MANUAL_ATTENDANCE_KEY);
  return loaded || {};
}

/**
 * 2) 특정 날짜(dateStr) 한 건의 수동 출결 데이터만 불러온다.
 * @param {string} dateStr 'YYYY-MM-DD'
 * @returns {Promise<Object.<string, object>>} 그 날짜에 저장된 { [studentId]: {...} }, 없으면 빈 객체 {}
 */
async function loadManualAttendanceForDate(dateStr) {
  if (!dateStr) return {};
  const all = await loadAllManualAttendance();
  return (all && all[dateStr]) || {};
}

/**
 * 한 학생/날짜의 record 입력값을 저장 규격(record shape)으로 정규화한다. (내부 헬퍼)
 */
function normalizeManualRecord(record) {
  const r = record || {};
  return {
    status: r.status || '',
    time: r.time || '',
    timeband: r.timeband || '',
    absenceReason: r.absenceReason || '',
    customReason: r.customReason || '',
    leaveReason: r.leaveReason || '',
    updatedAt: new Date().toISOString(),
  };
}

/**
 * 3) 한 학생/한 날짜의 수동 출결 기록 1건을 저장한다.
 * 저장 직전에 항상 전체 데이터를 다시 불러와 그 날짜/학생 항목만 갈아끼우므로
 * 다른 날짜나 다른 학생의 기록은 전혀 영향을 받지 않는다.
 * @param {string} dateStr 'YYYY-MM-DD'
 * @param {string} studentId
 * @param {{status:string, time?:string, timeband?:string, absenceReason?:string, customReason?:string}} record
 * @returns {Promise<{ok:boolean, all:object}>} ok=false면 storageSetJSON 실패(저장 안 됨) - saveError로 안내
 */
async function saveManualAttendanceRecord(dateStr, studentId, record) {
  if (!dateStr || !studentId) return { ok: false, all: await loadAllManualAttendance() };
  const all = await loadAllManualAttendance();
  const next = { ...all };
  const forDate = { ...(next[dateStr] || {}) };
  forDate[studentId] = normalizeManualRecord(record);
  next[dateStr] = forDate;
  const ok = await storageSetJSON(MANUAL_ATTENDANCE_KEY, next);
  return { ok, all: next };
}

/**
 * 4) 한 날짜에 여러 학생의 수동 출결 기록을 한번에 저장한다 (예: 하루치 일괄 수정/일괄 저장).
 * @param {string} dateStr 'YYYY-MM-DD'
 * @param {Object.<string, object>} recordsByStudentId { [studentId]: {status, time, timeband, absenceReason, customReason} }
 * @returns {Promise<{ok:boolean, all:object}>}
 */
async function saveManualAttendanceRecords(dateStr, recordsByStudentId) {
  if (!dateStr || !recordsByStudentId) return { ok: false, all: await loadAllManualAttendance() };
  const all = await loadAllManualAttendance();
  const next = { ...all };
  const forDate = { ...(next[dateStr] || {}) };
  Object.keys(recordsByStudentId).forEach(studentId => {
    forDate[studentId] = normalizeManualRecord(recordsByStudentId[studentId]);
  });
  next[dateStr] = forDate;
  const ok = await storageSetJSON(MANUAL_ATTENDANCE_KEY, next);
  return { ok, all: next };
}

/**
 * 5) 특정 학생/날짜의 수동 오버라이드 1건을 제거한다 (자동 계산 결과로 되돌림).
 * 해당 항목이 원래 없었다면 아무것도 바꾸지 않고 ok:true를 반환한다.
 * @param {string} dateStr 'YYYY-MM-DD'
 * @param {string} studentId
 * @returns {Promise<{ok:boolean, all:object}>}
 */
async function removeManualAttendanceRecord(dateStr, studentId) {
  const all = await loadAllManualAttendance();
  if (!dateStr || !studentId || !all[dateStr] || !all[dateStr][studentId]) {
    return { ok: true, all };
  }
  const next = { ...all };
  const forDate = { ...next[dateStr] };
  delete forDate[studentId];
  next[dateStr] = forDate;
  const ok = await storageSetJSON(MANUAL_ATTENDANCE_KEY, next);
  return { ok, all: next };
}

/**
 * 6) 한 학생의 특정 날짜 "최종" 출결 상태를 계산한다.
 * 우선순위: 그 날짜/학생에 수동 오버라이드 기록이 있으면 그 값이 무조건 최우선이며,
 * 없으면 기존 자동 계산 결과(autoResult - 보통 resolveDailyAttendance()의 반환값)를 그대로 사용한다.
 * 이 함수는 순수 함수이며 자동 계산 로직 자체(resolveDailyAttendance)는 전혀 수정하지 않는다.
 * @param {object} params
 * @param {string} params.studentId
 * @param {string} params.dateStr
 * @param {Object.<string, object>} params.manualForDate  loadManualAttendanceForDate(dateStr) 결과
 * @param {object} [params.autoResult] resolveDailyAttendance(...) 결과 (없으면 빈 기본값)
 * @returns {{studentId:string, date:string, status:string, time:string, timeband:string,
 *   absenceReason:string, customReason:string, displayText:string, isManual:boolean}}
 */
function resolveFinalAttendanceStatus({ studentId, dateStr, manualForDate, autoResult }) {
  const manual = manualOverrideForDate(studentId, manualForDate);
  if (!manual) {
    return { ...(autoResult || {}), isManual: false };
  }
  const statusLabel = MANUAL_STATUS_LABEL[manual.status] || manual.status || '';
  let displayText = statusLabel;
  if (manual.status === MANUAL_STATUS.PRESENT) {
    displayText = manual.timeband || manual.time || '출석';
  } else if (manual.status === MANUAL_STATUS.ABSENT) {
    if (manual.absenceReason === '기타' && manual.customReason) {
      displayText = `기타(${manual.customReason})`;
    } else if (manual.absenceReason) {
      displayText = manual.absenceReason;
    } else {
      displayText = '결석';
    }
  }
  return {
    studentId,
    date: dateStr,
    status: statusLabel,
    time: manual.time || '',
    timeband: manual.timeband || '',
    absenceReason: manual.absenceReason || '',
    customReason: manual.customReason || '',
    displayText,
    isManual: true,
  };
}

/**
 * 한 학생의 특정 날짜에 대한 정규화된 출결 결과를 계산한다.
 *
 * 적용 우선순위:
 *  0) 그 날짜/학생에 수동 출결 오버라이드 기록(manualForDate)이 있으면 그 값이 무조건 최우선이다.
 *     미래 날짜든, 휴관/공휴일이든, 등원 요일이 아니든, 휴원 기간 중이든 상관없이 수동 기록이
 *     이 모든 자동 계산 결과를 덮어쓴다 ([수동 출결 수정 - Part 2] manualOverrideForDate 재사용).
 *  1) (수동 기록 없음) 그 날짜의 출석 기록 (att-YYYY-MM-DD) - 등원 요일이 아니어도 실제 출석했다면
 *     최우선으로 '출석' 처리한다 (기존 exportDaily의 '보강(비정규 등원)' 처리와
 *     동일한 전제 - 비정규 등원도 출석 기록이 있으면 출석으로 보여줘야 함).
 *  1.5) (수동 기록 없음) 휴원 기간
 *  2) (수동 기록 없음) 그 학생/날짜의 결석 등록 기록 (absences) - 미래 날짜라도 결석 기록이 있으면
 *     (예: 방학 전에 미리 등록한 여행) 표시한다.
 *  3) (수동 기록 없음) 그 날짜의 휴관/공휴일 기록 (closures / HOLIDAYS) - 미래 휴관일도 표시한다.
 *  4) 위 세 가지가 전부 없고, 미래 날짜라면 -> 빈 칸('해당없음')
 *  5) 위 세 가지가 전부 없고, 그 학생의 등원 요일이 아니라면 -> 빈 칸('해당없음')
 *  6) 위 세 가지가 전부 없고, 과거(또는 오늘)의 등원 요일이라면 -> '결석'
 *
 * displayText(상세 출석부 셀에 그대로 들어가는 값) 규격:
 *   [수동] present  -> 시간반 있으면 시간반, 없고 시각만 있으면 시각, 둘 다 없으면 '등원'
 *   [수동] absent   -> 결석사유(기타면 '기타(상세내용)' 포함) 있으면 그 사유, 없으면 '결석'
 *   [수동] leave    -> '휴원'
 *   [수동] not_arrived -> '미등원' (그대로)
 *   출석 + 시간반 있음        -> 시간반 그대로 (예: '3시반')
 *   출석 + 시간반 없음/시각만 -> 시각 그대로 (예: '15:30')
 *   출석 + 시간반/시각 모두 없음 -> '출석'
 *   병결/여행/휴가            -> 라벨 그대로
 *   기타 + 상세내용 있음      -> '기타(상세내용)' (예: '기타(가족 행사)')
 *   기타 + 상세내용 없음      -> '기타'
 *   결석                     -> '결석'
 *   휴관/공휴일               -> '휴관' (사유는 셀에 넣지 않음. 필요하면 isClosure 플래그로 확인)
 *   미래 날짜 / 등원 요일 아님(기록 없음) -> '' (빈 칸)
 *
 * @param {object} params
 * @param {string} params.studentId
 * @param {string} params.dateStr            'YYYY-MM-DD'
 * @param {{days:string[]}} params.studentMeta  metaOf(studentId) 결과
 * @param {object} params.attendanceForDate     storageGetJSON('att-'+dateStr) 결과 (없으면 {})
 * @param {object} params.absences              App의 absences 상태
 * @param {object} params.closures              App의 closures 상태
 * @param {Object.<string,object>} [params.manualForDate] loadManualAttendanceForDate(dateStr) 결과 (또는 loadAllManualAttendance() 결과 중 그 날짜분) - 없으면 수동 오버라이드 없음으로 간주
 * @param {Date}   params.today0                startOfDay(now) - 오늘 자정 기준 Date
 * @returns {{
 *   studentId:string, date:string, status:string, time:string, timeband:string,
 *   absenceReason:string, customReason:string, displayText:string,
 *   isScheduled:boolean, isFuture:boolean, isClosure:boolean, attendanceTime:string, isManual:boolean
 * }}
 */
function resolveDailyAttendance({ studentId, dateStr, studentMeta, attendanceForDate, absences, closures, enrollments, manualForDate, today0 }) {
  const d = new Date(dateStr + 'T00:00:00');
  const wk = weekdayKrOf(d);
  const isScheduled = !!(studentMeta && studentMeta.days && studentMeta.days.includes(wk));
  const isFuture = !!(today0 && d > today0);
  const off = dayOffInfo(dateStr, closures);

  const base = {
    studentId, date: dateStr,
    status: '해당없음', time: '', timeband: '',
    absenceReason: '', customReason: '', leaveReason: '', displayText: '',
    isScheduled, isFuture, isClosure: off.off, isLeave: false,
    attendanceTime: '', isManual: false,
  };

  // 0) 수동 출결 오버라이드 - 미래/휴관/비등원요일/휴원 여부와 무관하게 항상 최우선으로 적용된다.
  const manual = manualOverrideForDate(studentId, manualForDate);
  if (manual) {
    const statusLabel = MANUAL_STATUS_LABEL[manual.status] || manual.status || '';
    let displayText = statusLabel;
    if (manual.status === MANUAL_STATUS.PRESENT) {
      displayText = manual.timeband || manual.time || '등원';
    } else if (manual.status === MANUAL_STATUS.ABSENT) {
      if (manual.absenceReason === '기타' && manual.customReason) {
        displayText = `기타(${manual.customReason})`;
      } else {
        displayText = manual.absenceReason || '결석';
      }
    } else if (manual.status === MANUAL_STATUS.LEAVE) {
      displayText = manual.leaveReason ? `휴원(${manual.leaveReason})` : '휴원';
    } else if (manual.status === MANUAL_STATUS.NOT_ARRIVED) {
      displayText = '미등원';
    }
    return {
      ...base,
      status: statusLabel,
      time: manual.time || '',
      attendanceTime: manual.status === MANUAL_STATUS.PRESENT ? (manual.time || '') : '',
      timeband: manual.timeband || '',
      absenceReason: manual.absenceReason || '',
      customReason: manual.customReason || '',
      leaveReason: manual.leaveReason || '',
      displayText,
      isLeave: manual.status === MANUAL_STATUS.LEAVE,
      isManual: true,
    };
  }

  // 1) 출석 기록 최우선
  const attRec = attendanceForDate && attendanceForDate[studentId];
  if (attRec) {
    // 상세 출석부 셀 표기 규격: 시간반이 있으면 시간반, 없고 시각만 있으면 시각(HH:MM), 둘 다 없으면 '출석'
    let displayText = '출석';
    if (attRec.timeband) displayText = attRec.timeband;
    else if (attRec.time) displayText = attRec.time;
    return {
      ...base,
      status: '출석',
      time: attRec.time || '',
      attendanceTime: attRec.time || '',
      timeband: attRec.timeband || '',
      displayText,
    };
  }

  // 1.5) 휴원 기간 (실제 출석 기록이 없을 때만 적용 - 휴원중이어도 실제 등원했다면 출석이 우선)
  const leaveRec = enrollments ? leaveInfoForDate(studentId, dateStr, enrollments) : null;
  if (leaveRec) {
    return {
      ...base,
      status: '휴원',
      displayText: leaveReasonDisplayText(leaveRec),
      isLeave: true,
    };
  }

  // 2) 결석 등록 기록
  const absRec = findAbsenceForDate(studentId, dateStr, absences);
  if (absRec) {
    const label = REASON_LABEL_BY_KEY[absRec.reasonType] || absRec.reasonType || '기타';
    const customReason = absRec.reasonType === 'other' ? (absRec.customReason || '') : '';
    return {
      ...base,
      status: label,
      absenceReason: label,
      customReason,
      displayText: absenceReasonDisplayText(absRec),
    };
  }

  // 3) 휴관/공휴일 (셀 표기는 사유 없이 '휴관'만 - 사유는 isClosure 플래그로 별도 확인 가능)
  if (off.off) {
    return { ...base, status: '휴관', displayText: '휴관' };
  }

  // 4) 미래 날짜는 빈 칸
  if (isFuture) return base;

  // 5) 등원 요일이 아니면 빈 칸
  if (!isScheduled) return base;

  // 6) 과거(또는 오늘)의 등원 요일인데 아무 기록도 없으면 결석
  return { ...base, status: '결석', displayText: '결석' };
}

/**
 * start(포함)부터 end(포함)까지의 Date 배열을 로컬 시간 기준으로 하루씩 만든다.
 * new Date(y, m, d) 형태의 로컬 생성자만 사용하는 기존 헬퍼(addDays/startOfDay)를
 * 재사용하므로 UTC 변환으로 인한 하루 밀림 문제가 없다.
 */
function buildDateList(start, end) {
  const list = [];
  let cur = startOfDay(start);
  const endD = startOfDay(end);
  while (cur <= endD) {
    list.push(cur);
    cur = addDays(cur, 1);
  }
  return list;
}

/**
 * 기준일(anchor)이 속한 '달'의 1일 ~ 마지막 날 Date 리스트.
 * getMonthEnd가 new Date(y, m+1, 0)로 그 달의 마지막 날을 계산하므로
 * 2월/윤년/30일·31일 달이 모두 자동으로 올바르게 처리된다.
 */
function getMonthDateList(anchor) {
  return buildDateList(getMonthStart(anchor), getMonthEnd(anchor));
}

/**
 * 기준일(anchor)이 속한 '주'의 월요일 ~ 일요일 Date 리스트.
 * 기존 앱의 주간 리포트와 동일하게 getMonday/getSunday를 그대로 재사용하므로
 * 주가 월/연도 경계를 넘어가는 경우도 기존 리포트와 동일하게 처리된다.
 */
function getWeekDateList(anchor) {
  return buildDateList(getMonday(anchor), getSunday(anchor));
}

/**
 * 주어진 날짜 리스트에 대해 att-YYYY-MM-DD 출석 기록을 일괄 로드한다.
 * runReport()에 있던 동일한 로직을 재사용 가능한 형태로 추출한 것으로,
 * 오늘 날짜는 이미 메모리에 있는 todayAttendance를 그대로 쓰고(중복 로드 방지),
 * 아직 오지 않은 미래 날짜는 빈 객체로 채운다.
 *
 * @param {Date[]} dateList
 * @param {object} opts
 * @param {string} [opts.todayKey]
 * @param {object} [opts.todayAttendance]
 * @param {Date}   [opts.today0]
 * @returns {Promise<Object.<string, object>>} { 'YYYY-MM-DD': { [studentId]: {time, timeband} } }
 */
async function loadAttendanceByDate(dateList, { todayKey, todayAttendance, today0 } = {}) {
  const attByDate = {};
  await Promise.all(dateList.map(async d => {
    const dk = dateKey(d);
    if (todayKey && dk === todayKey) { attByDate[dk] = todayAttendance || {}; return; }
    if (today0 && d > today0) { attByDate[dk] = {}; return; }
    attByDate[dk] = (await storageGetJSON('att-' + dk)) || {};
  }));
  return attByDate;
}

/* =========================================================================
 * 요약표(주간/월간) 헬퍼 (Part 3 - 중복 제거를 위한 리팩터)
 * -------------------------------------------------------------------------
 * NOTE (English): computeSummaryRows()/buildSummarySheet() are extracted
 * from the original inline runReport()/exportReport() bodies, unchanged in
 * behavior. They are pure/reusable so that BOTH the existing 조회(query)+
 * 엑셀로 저장 flow AND the new standalone "주간 요약표 저장" / "월간 요약표
 * 저장" buttons call the exact same logic instead of duplicating it.
 * ========================================================================= */

/**
 * 특정 기간(주간/월간)의 원생별 등원 요약 데이터를 계산한다.
 * [Part 4] 요일별 칸(dayMarks)과 출석 여부 판정은 상세 출석부와 동일하게 공용
 * resolveDailyAttendance()를 통해 계산한다 (수동 출결 오버라이드 반영, 로직 중복 없음).
 *
 * @param {object} params
 * @param {'week'|'month'} params.mode
 * @param {string} params.anchorStr   'YYYY-MM-DD'
 * @param {object} params.meta        App의 meta 상태 ({ [studentId]: {days:[]} })
 * @param {object} params.closures    App의 closures 상태
 * @param {Date}   params.now
 * @param {object} params.todayAttendance
 * @param {string} params.todayKey
 * @param {object[]} params.students  현재 원생 목록 (App의 students 상태)
 * @param {object} [params.absences]  App의 absences 상태 (결석 등록 기록 - resolveDailyAttendance에 필요)
 * @returns {Promise<{rows:object[], periodStart:Date, periodEnd:Date, clampedEnd:Date}>}
 */
async function computeSummaryRows({ mode, anchorStr, meta, closures, enrollments, absences, now, todayAttendance, todayKey, students }) {
  const anchor = new Date(anchorStr + 'T00:00:00');
  const periodStart = mode === 'week' ? getMonday(anchor) : getMonthStart(anchor);
  const periodEnd = mode === 'week' ? getSunday(anchor) : getMonthEnd(anchor);
  const today0 = startOfDay(now);
  const clampedEnd = periodEnd > today0 ? today0 : periodEnd;

  const dateList = buildDateList(periodStart, periodEnd);
  const attByDate = await loadAttendanceByDate(dateList, { todayKey, todayAttendance, today0 });
  // [Part 4] 수동 출결 오버라이드도 상세 출석부와 동일하게 resolveDailyAttendance를 통해 반영한다.
  const allManualAttendance = await loadAllManualAttendance();
  const metaOfLocal = (id) => (meta && meta[id]) ? meta[id] : { days: [] };

  const rows = (students || []).filter(s => {
    const m = metaOfLocal(s.id);
    return m.days && m.days.length > 0;
  }).map(s => {
    const m = metaOfLocal(s.id);
    const quotaRaw = countScheduledOccurrences(m.days, periodStart, clampedEnd, closures);
    let actual = 0;
    let leaveScheduledCount = 0; // 휴원 기간과 겹치는 등원예정일 수 (결석/할당량에서 제외)
    const dayMarks = {};
    const dayLeaveFlags = {}; // { [요일]: true } - 엑셀 내보내기 시 빨간 셀 표시용
    dateList.forEach(d => {
      const dk = dateKey(d);
      const wk = weekdayKrOf(d);
      const scheduled = m.days && m.days.includes(wk);
      const off = dayOffInfo(dk, closures);
      // [Part 4] 출석/결석/휴원/수동오버라이드 우선순위 판단은 전부 공용 resolveDailyAttendance로 위임
      // (상세 출석부와 동일 로직 - 중복 구현하지 않음). present -> 자동 출석이든 수동 '출석' 처리든
      // status가 '출석'으로 동일하게 나오므로 이 한 줄로 두 경우를 모두 커버한다.
      const result = resolveDailyAttendance({
        studentId: s.id, dateStr: dk, studentMeta: m,
        attendanceForDate: attByDate[dk], absences, closures, enrollments,
        manualForDate: allManualAttendance[dk], today0,
      });
      const present = result.status === '출석';
      if (present && d <= clampedEnd) actual++;
      if (!present && result.isLeave && scheduled && !off.off && d <= clampedEnd) leaveScheduledCount++;
      if (mode === 'week') {
        const isWeekendCol = wk === '토' || wk === '일';
        if (DAYS.includes(wk)) {
          if (result.isLeave) { dayMarks[wk] = result.displayText; dayLeaveFlags[wk] = true; }
          else if (!result.isManual && !present && off.off && scheduled) {
            // 자동 휴관/공휴일은 (수동 오버라이드가 없을 때만) 구체적인 휴관 사유명을 함께 표시
            dayMarks[wk] = off.label ? `휴관(${off.label})` : '휴관';
          } else {
            dayMarks[wk] = result.displayText || (scheduled ? (d <= clampedEnd ? '결석' : '-') : '-');
          }
        } else if (isWeekendCol) {
          // 토/일은 원 스케줄에 없는 날 -> 항상 휴관(원 사정과 무관하게 주말은 쉬는 날로 표기)
          dayMarks[wk] = off.off ? `휴관(${off.label})` : '휴관';
        }
      }
    });
    const quota = Math.max(0, quotaRaw - leaveScheduledCount);
    const shortage = Math.max(0, quota - actual);
    return {
      name: s.label,
      grade: s.grade || '',
      schedule: (m.days && m.days.length > 0) ? m.days.join('') + `(주${m.days.length}회)` : '미설정',
      quota, actual, shortage, dayMarks, dayLeaveFlags,
      fatherPhone: formatPhoneLabel(s.fatherName, s.fatherPhone),
      motherPhone: formatPhoneLabel(s.motherName, s.motherPhone),
    };
  }).sort((a, b) => a.grade.localeCompare(b.grade) || a.name.localeCompare(b.name));

  return { rows, periodStart, periodEnd, clampedEnd };
}

/**
 * 요약표(주간/월간)의 시트 데이터/시트명/파일명을 만든다.
 * (기존 exportReport()의 시트 구성부를 그대로 옮긴 것 - 출력값은 100% 동일,
 * 이름/시트명 등 기존 명명 규칙(출결표)은 변경하지 않음)
 */
function buildSummarySheet(mode, rows, periodStart, periodEnd) {
  let data, sheetName, fileTag;
  const leaveCells = []; // [{row, col}] - 0-indexed 데이터 행/열 (엑셀에서 연분홍 셀 표시용, 주간표만 해당)
  const weekendCols = []; // [{col, isSaturday}] - 주말(토/일) 칸은 원 사정과 무관하게 통째로 배경 처리 (토=하늘색, 일=연분홍)
  if (mode === 'week') {
    // 이름(0)/학년(1)/스케줄(2)/월(3)/화(4)/수(5)/목(6)/금(7)/토(8)/일(9)/아버님(10)/어머님(11)
    weekendCols.push({ col: 8, isSaturday: true }, { col: 9, isSaturday: false });
    data = rows.map((r, i) => {
      ['월', '화', '수', '목', '금', '토', '일'].forEach((d, ci) => {
        if (r.dayLeaveFlags && r.dayLeaveFlags[d]) leaveCells.push({ row: i, col: 3 + ci });
      });
      return {
        '이름': r.name, '학년': r.grade, '스케줄': r.schedule,
        '월': r.dayMarks['월'] || '-', '화': r.dayMarks['화'] || '-', '수': r.dayMarks['수'] || '-',
        '목': r.dayMarks['목'] || '-', '금': r.dayMarks['금'] || '-',
        '토요일': r.dayMarks['토'] || '휴관', '일요일': r.dayMarks['일'] || '휴관',
        '아버님': r.fatherPhone, '어머님': r.motherPhone,
      };
    });
    sheetName = '주간출결표'; fileTag = `주간출결표_${dateKey(periodStart)}~${dateKey(periodEnd)}`;
  } else {
    data = rows.map(r => ({
      '이름': r.name, '학년': r.grade, '스케줄': r.schedule,
      '아버님': r.fatherPhone, '어머님': r.motherPhone,
    }));
    sheetName = '월간출결표'; fileTag = `월간출결표_${periodStart.getFullYear()}년${periodStart.getMonth() + 1}월`;
  }
  return { data, sheetName, fileTag, leaveCells, weekendCols };
}

/** 요약표 데이터를 실제 xlsx 파일로 저장한다 (json_to_sheet 기반, 기존 방식 그대로). */
function writeSummaryWorkbook(mode, rows, periodStart, periodEnd) {
  const { data, sheetName, fileTag, leaveCells, weekendCols } = buildSummarySheet(mode, rows, periodStart, periodEnd);
  const ws = XLSX.utils.json_to_sheet(data, { origin: 'A2' });
  const label = mode === 'week'
    ? `정도태권도 ${periodStart.getFullYear()}년 ${periodStart.getMonth() + 1}월 ${periodStart.getDate()}일 - ${periodEnd.getMonth() + 1}월 ${periodEnd.getDate()}일 주간요약표`
    : `정도태권도 ${periodStart.getFullYear()}년 ${periodStart.getMonth() + 1}월 월간요약표`;
  const colCount = Object.keys(data[0] || {}).length || 1;
  XLSX.utils.sheet_add_aoa(ws, [[label]], { origin: 'A1' });
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: colCount - 1 } }];
  applyTableStyle(ws, { titleRows: 1 });
  // 주말(토/일) 열은 헤더부터 마지막 데이터 행까지 통째로 배경 처리 (leaveCells보다 먼저 적용)
  // 토요일은 하늘색, 일요일은 연분홍으로 구분
  (weekendCols || []).forEach(({ col, isSaturday }) => {
    const styleFn = isSaturday ? applySkyBlueCellStyle : applyRedCellStyle;
    styleFn(ws, 1, col); // 헤더 행(2행, 0-index 1)
    data.forEach((_, row) => styleFn(ws, 2 + row, col));
  });
  (leaveCells || []).forEach(({ row, col }) => applyRedCellStyle(ws, 2 + row, col));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, `${fileTag}.xlsx`);
}

/**
 * 워크시트 전체 셀에 '표'처럼 보이도록 스타일을 입힌다.
 * - 모든 셀: 가운데 정렬(가로/세로) + 얇은 테두리
 * - 1행(제목행, titleRows로 지정한 만큼): 굵게 + 조금 더 큰 글씨
 * xlsx-js-style 라이브러리가 있어야 저장 시 스타일이 실제로 반영된다.
 */
function applyTableStyle(ws, { titleRows = 0 } = {}) {
  if (!ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  const thinBorder = { style: 'thin', color: { rgb: 'FF999999' } };
  for (let r = range.s.r; r <= range.e.r; r++) {
    for (let c = range.s.c; c <= range.e.c; c++) {
      const addr = XLSX.utils.encode_cell({ r, c });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      const isTitle = r < titleRows;
      ws[addr].s = {
        alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
        border: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder },
        font: isTitle ? { bold: true, sz: 14 } : { sz: 11 },
      };
    }
  }
}

/**
 * 특정 셀(0-indexed 행/열)에 연분홍 배경 + 진한 빨간 글씨 스타일을 덧입힌다
 * (일요일/공휴일/휴관일/휴원 기간 표시용 - 기존 진한 빨간 배경 대신 눈이 편한 연분홍으로 변경).
 * applyTableStyle()이 먼저 셀 전체에 테두리/정렬 스타일을 입힌 "이후"에 호출해야
 * 기존 스타일(테두리/정렬)은 유지한 채 배경색만 바뀐다.
 */
function applyRedCellStyle(ws, r, c) {
  const addr = XLSX.utils.encode_cell({ r, c });
  if (!ws[addr]) ws[addr] = { t: 's', v: '' };
  const prev = ws[addr].s || {};
  ws[addr].s = {
    ...prev,
    fill: { patternType: 'solid', fgColor: { rgb: 'FFFFC7CE' } }, // 연분홍
    font: { ...(prev.font || {}), color: { rgb: 'FF9C0006' }, bold: true }, // 진한 빨간 글씨
  };
}

/**
 * 특정 셀(0-indexed 행/열)에 하늘색 배경 + 진한 파란 글씨 스타일을 덧입힌다 (토요일 표시 전용).
 * applyRedCellStyle()과 동일한 방식이며, 토요일 열만 빨간/분홍 계열과 구분되도록 별도 색을 쓴다.
 */
function applySkyBlueCellStyle(ws, r, c) {
  const addr = XLSX.utils.encode_cell({ r, c });
  if (!ws[addr]) ws[addr] = { t: 's', v: '' };
  const prev = ws[addr].s || {};
  ws[addr].s = {
    ...prev,
    fill: { patternType: 'solid', fgColor: { rgb: 'FFBDD7EE' } }, // 하늘색
    font: { ...(prev.font || {}), color: { rgb: 'FF1F4E78' }, bold: true }, // 진한 파란 글씨
  };
}

/* ========================= 카카오톡(공유) 헬퍼 ========================= */
/**
 * 텍스트를 공유한다. 모바일 브라우저에서 Web Share API(navigator.share)를 지원하면
 * 시스템 공유 시트(카카오톡 포함)를 띄우고, 지원하지 않으면 클립보드에 복사해서
 * 카카오톡 등에 직접 붙여넣을 수 있게 한다.
 * @returns {Promise<'shared'|'copied'|'failed'|'cancelled'>}
 */
async function shareText(text) {
  if (navigator.share) {
    try {
      await navigator.share({ text });
      return 'shared';
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
      // 공유 실패 시 클립보드 복사로 폴백
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    return 'copied';
  } catch (e) {
    return 'failed';
  }
}

/* ========================= 전체 기록 백업(다른 폰과 합치기) 헬퍼 ========================= */
/**
 * 학생/스케줄/출석기록(전체 날짜)/결석사유/휴관일/재원-휴원 상태 등 앱에 저장된 모든 데이터를
 * 하나의 텍스트로 만든다. 카카오톡/문자로 그대로 복사해서 보내면, 받는 쪽에서 "가져오기"에
 * 붙여넣어 합칠 수 있다.
 * BACKUP_MARK_START~END 사이에 JSON을 끼워 넣어서, 인사말 등 다른 텍스트가 앞뒤에 섞여도
 * 가져오기 쪽에서 필요한 부분만 정확히 찾아낼 수 있게 한다.
 */
function buildFullBackupText(payload) {
  const json = JSON.stringify(payload);
  const dayCount = Object.keys(payload.attendanceByDate || {}).length;
  const countText = `원생 ${(payload.students || []).length}명 · 출석기록 ${dayCount}일치 · 결석등록 ${Object.keys(payload.absences || {}).length}건 · 휴관일 ${Object.keys(payload.closures || {}).length}건`;
  return `[정도태권도] 전체 기록 백업 (${countText})\n\n${BACKUP_MARK_START}${json}${BACKUP_MARK_END}\n\n↑ 이 메시지를 그대로 복사해서, 받는 폰의 "결석·연락" 탭 > "다른 폰과 기록 합치기" > 가져오기에 붙여넣어주세요.`;
}
/** buildFullBackupText로 만든 텍스트(또는 그 일부가 포함된 아무 텍스트)에서 백업 데이터를 추출한다. 실패하면 null. */
function parseFullBackupText(text) {
  if (!text) return null;
  const start = text.indexOf(BACKUP_MARK_START);
  const end = text.indexOf(BACKUP_MARK_END);
  if (start === -1 || end === -1 || end <= start) return null;
  const json = text.slice(start + BACKUP_MARK_START.length, end);
  try {
    const payload = JSON.parse(json);
    if (!payload || payload.type !== 'dojang-full-backup') return null;
    return payload;
  } catch (e) {
    return null;
  }
}
/**
 * 백업 데이터를 텍스트에서 최대한 유연하게 찾아낸다.
 * 1) 카카오톡/문자로 공유된, 마커(@TKD_BACKUP_START@...@TKD_BACKUP_END@)가 포함된 텍스트
 * 2) 마커 없이 JSON 파일 내용을 그대로 붙여넣거나 읽은 경우(= downloadFullBackupJSON 결과)
 * 둘 다 실패하면 null.
 */
function parseBackupPayloadFromText(text) {
  const viaMarker = parseFullBackupText(text);
  if (viaMarker) return viaMarker;
  if (!text) return null;
  try {
    const payload = JSON.parse(text.trim());
    if (payload && payload.type === 'dojang-full-backup') return payload;
  } catch (e) { /* JSON이 아니면 무시 */ }
  return null;
}
