function AbsentTab({ absentToday, metaOf, absenceRegisteredToday, reportDailyDate, setReportDailyDate, onExportDaily, todayWeekday, todayOff, closures, onToggleClosure, onOpenAbsenceModal, onEditAbsence, onRemoveAbsence, onEditManual, onRemoveManual, onShareAbsent, onShareFullBackup, onImportFullBackup, onDownloadBackupJSON, onImportBackupFile }) {
  const [closureDate, setClosureDate] = useState(reportDailyDate);
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState('');
  const [importBusy, setImportBusy] = useState(false);
  const [backupBusy, setBackupBusy] = useState(false);
  const [fileBusy, setFileBusy] = useState(false);
  const fileInputRef = React.useRef(null);
  const closureList = useMemo(() => Object.keys(closures || {}).sort(), [closures]);

  const handleShareBackup = async () => {
    if (backupBusy) return;
    setBackupBusy(true);
    await onShareFullBackup();
    setBackupBusy(false);
  };

  const handleImport = async () => {
    if (!importText.trim() || importBusy) return;
    setImportBusy(true);
    const ok = await onImportFullBackup(importText.trim());
    setImportBusy(false);
    if (ok) { setImportText(''); setImportOpen(false); }
  };

  const handlePickFile = () => { if (!fileBusy) fileInputRef.current && fileInputRef.current.click(); };
  const handleFileChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // 같은 파일을 다시 선택해도 onChange가 또 발생하도록 초기화
    if (!file) return;
    setFileBusy(true);
    await onImportBackupFile(file);
    setFileBusy(false);
  };

  return (
    <div>
      <Section title={`오늘(${todayWeekday}) 등원 예정인데 아직 미출석 (${absentToday.length}명)`}>
        {!todayOff.off && absentToday.length > 0 && (
          <button style={{ ...S.shareBtn, marginBottom: 10 }} onClick={onShareAbsent}>💬 미출석 명단 카톡 공유 (연락처 포함)</button>
        )}
        {todayOff.off ? (
          <div style={S.hint}>오늘은 {todayOff.label}이라 결석 처리를 하지 않아요.</div>
        ) : absentToday.length === 0 ? (
          <div style={S.hint}>전원 출석했거나 오늘 등원 예정인 학생이 없어요.</div>
        ) : (
          <div style={S.absentList}>
            {absentToday.map(s => (
              <div key={s.id} style={S.absentCard}>
                <div style={S.absentName}>{s.label} <span style={S.absentBand}>{s.grade || '학년미상'}</span></div>
                <div style={S.contactRow}>
                  {s.fatherPhone && (
                    <>
                      <a href={`tel:${s.fatherPhone}`} style={S.callBtn}>☎ 아버님</a>
                      <a href={`sms:${s.fatherPhone}`} style={S.smsBtn}>✉ 아버님</a>
                    </>
                  )}
                  {s.motherPhone && (
                    <>
                      <a href={`tel:${s.motherPhone}`} style={S.callBtn}>☎ 어머님</a>
                      <a href={`sms:${s.motherPhone}`} style={S.smsBtn}>✉ 어머님</a>
                    </>
                  )}
                  {!s.fatherPhone && !s.motherPhone && <span style={S.hint}>등록된 연락처 없음</span>}
                  <button style={S.absenceRegBtn} onClick={() => onOpenAbsenceModal(s)}>결석 등록</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Section>

      {absenceRegisteredToday.length > 0 && (
        <Section title={`오늘 결석·휴원 처리됨 (${absenceRegisteredToday.length}명)`}>
          <div style={S.absentList}>
            {absenceRegisteredToday.map((entry) => {
              const s = entry.student;
              if (entry.source === 'manual') {
                return (
                  <div key={s.id} style={S.absentCard}>
                    <div style={S.absentName}>{s.label} <span style={S.absentBand}>{s.grade || '학년미상'}</span></div>
                    <div style={S.leaveInfoRow}>{entry.reasonText} <span style={S.manualOverrideTag}>수동수정됨</span></div>
                    <div style={S.contactRow}>
                      <button style={S.editBtnSmall} onClick={() => onEditManual(s)}>수정</button>
                      <button style={S.deleteBtnSmall} onClick={() => onRemoveManual(s.id)}>취소</button>
                    </div>
                  </div>
                );
              }
              const rec = entry.rec;
              return (
                <div key={s.id} style={S.absentCard}>
                  <div style={S.absentName}>{s.label} <span style={S.absentBand}>{s.grade || '학년미상'}</span></div>
                  <div style={S.leaveInfoRow}>{absenceReasonDisplayText(rec)}{rec.startDate !== rec.endDate ? ` (${rec.startDate} ~ ${rec.endDate})` : ''}</div>
                  <div style={S.contactRow}>
                    <button style={S.editBtnSmall} onClick={() => onEditAbsence(s, rec)}>수정</button>
                    <button style={S.deleteBtnSmall} onClick={() => onRemoveAbsence(rec.id)}>취소</button>
                  </div>
                </div>
              );
            })}
          </div>
        </Section>
      )}

      <Section title="다른 폰과 기록 합치기 (전체 백업 공유)">
        <div style={S.hint}>원생 목록·요일 스케줄·전체 출석기록·결석사유·휴관일·재원/휴원 상태까지 저장된 모든 데이터를 통째로 텍스트로 만들어 카카오톡/문자로 보낼 수 있어요. 받는 쪽에서 "가져오기"로 붙여넣으면, 서로 없는 기록만 자동으로 합쳐져요(이미 있는 기록은 덮어쓰지 않아요). 데이터량이 많으면 텍스트가 길어질 수 있어요 - 그대로 복사해서 보내면 돼요.</div>
        <button style={{ ...S.primaryBtn, marginTop: 8 }} onClick={handleShareBackup} disabled={backupBusy}>
          {backupBusy ? '백업 만드는 중…' : '💬 전체 기록 백업 공유'}
        </button>
        <button style={S.linkBtn} onClick={() => setImportOpen(true)}>📥 다른 폰에서 받은 기록 가져오기</button>
        <div style={{ ...S.hint, marginTop: 10 }}>텍스트 대신 JSON 파일로 주고받을 수도 있어요.</div>
        <div style={{ display: 'flex', gap: 8, marginTop: 6, flexWrap: 'wrap' }}>
          <button style={S.primaryBtn} onClick={onDownloadBackupJSON}>📄 JSON 파일로 내보내기</button>
          <button style={{ ...S.primaryBtn, background: '#fff', color: NAVY, border: `1.5px solid ${NAVY_SOFT}` }} onClick={handlePickFile} disabled={fileBusy}>
            {fileBusy ? '가져오는 중…' : '📂 JSON 파일 가져오기'}
          </button>
          <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleFileChange} style={S.hiddenCheckbox} />
        </div>
      </Section>

      <Section title="일일 출결표 다운로드">
        <div style={S.dateRow}>
          <input type="date" value={reportDailyDate} onChange={e => setReportDailyDate(e.target.value)} style={S.dateInput} />
          <button style={S.primaryBtn} onClick={() => onExportDaily(reportDailyDate)}>엑셀 다운로드</button>
        </div>
        <div style={S.hint}>선택한 날짜의 등원예정 학생 전체를 출석/결석으로 정리해 다운로드해요. 공휴일·휴관일은 자동으로 결석 대신 휴관으로 표시돼요.</div>
      </Section>

      <Section title="휴관일 관리">
        <div style={S.dateRow}>
          <input type="date" value={closureDate} onChange={e => setClosureDate(e.target.value)} style={S.dateInput} />
          <button style={S.primaryBtn} onClick={() => onToggleClosure(closureDate, '휴관')}>
            {closures[closureDate] ? '휴관 해제' : '휴관으로 설정'}
          </button>
        </div>
        <div style={S.hint}>2026~2028년 공휴일(빨간날)은 자동으로 반영돼요. 주말 외에 원 사정으로 쉬는 날은 여기서 직접 추가·해제하세요.</div>
        {closureList.length > 0 && (
          <div style={S.closureList}>
            {closureList.map(dk => (
              <div key={dk} style={S.closureRow}>
                <span>{dk} · {closures[dk]}</span>
                <button style={S.undoBtn} onClick={() => onToggleClosure(dk, '휴관')}>해제</button>
              </div>
            ))}
          </div>
        )}
      </Section>

      {importOpen && (
        <div style={S.modalOverlay} onClick={() => !importBusy && setImportOpen(false)}>
          <div style={S.modalCard} onClick={e => e.stopPropagation()}>
            <div style={S.modalHeader}>
              <div style={S.modalTitle}>다른 폰 기록 가져오기</div>
              <button style={S.modalCloseBtn} onClick={() => setImportOpen(false)} disabled={importBusy}>✕</button>
            </div>
            <div style={S.modalSubtitle}>받은 카카오톡/문자 메시지를 그대로 길게 눌러 복사한 뒤, 아래에 붙여넣어주세요.</div>
            <textarea
              value={importText}
              onChange={e => setImportText(e.target.value)}
              placeholder="여기에 붙여넣기"
              style={S.importTextarea}
            />
            <div style={S.modalBtnRow}>
              <button style={S.modalCancelBtn} onClick={() => setImportOpen(false)} disabled={importBusy}>취소</button>
              <button
                style={{ ...S.modalNextBtn, ...((!importText.trim() || importBusy) ? S.modalNextBtnDisabled : {}) }}
                onClick={handleImport}
                disabled={!importText.trim() || importBusy}
              >
                {importBusy ? '합치는 중…' : '가져와서 합치기'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 결석 등록 모달 ========================= */
function AbsenceModal({ student, editRecord, onClose, onConfirm }) {
  const isEdit = !!editRecord;
  const [step, setStep] = useState('reason'); // 'reason' | 'date' (2단계 날짜 선택 UI는 Part 2에서 확장 예정)
  const [reasonType, setReasonType] = useState(isEdit ? (editRecord.reasonType || '') : '');
  const [customReason, setCustomReason] = useState(isEdit ? (editRecord.customReason || '') : '');
  const [startDate, setStartDate] = useState(isEdit ? editRecord.startDate : dateKeyToInputValue(new Date()));
  const [endDate, setEndDate] = useState(isEdit ? editRecord.endDate : dateKeyToInputValue(new Date()));

  if (!student) return null;

  const canProceed = !!reasonType && (reasonType !== 'other' || customReason.trim().length > 0);

  const handleNext = () => {
    if (!canProceed) return;
    setStep('date');
  };

  const handleConfirm = () => {
    onConfirm({
      studentId: student.id,
      startDate,
      endDate,
      reasonType,
      customReason: reasonType === 'other' ? customReason.trim() : '',
    }, isEdit ? editRecord.id : undefined);
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>{student.label} 결석 {isEdit ? '수정' : '등록'}</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>

        {step === 'reason' && (
          <>
            <div style={S.modalSubtitle}>결석 사유를 선택해주세요</div>
            <div style={S.reasonGrid}>
              {REASON_OPTIONS.map(opt => (
                <button
                  key={opt.key}
                  style={{ ...S.reasonBtn, ...(reasonType === opt.key ? S.reasonBtnActive : {}) }}
                  onClick={() => setReasonType(opt.key)}
                >
                  {opt.label}
                </button>
              ))}
            </div>
            {reasonType === 'other' && (
              <input
                type="text"
                placeholder="결석 사유를 입력해주세요"
                value={customReason}
                onChange={e => setCustomReason(e.target.value)}
                style={S.reasonCustomInput}
              />
            )}
            <div style={S.modalBtnRow}>
              <button style={S.modalCancelBtn} onClick={onClose}>취소</button>
              <button
                style={{ ...S.modalNextBtn, ...(canProceed ? {} : S.modalNextBtnDisabled) }}
                onClick={handleNext}
                disabled={!canProceed}
              >
                다음
              </button>
            </div>
          </>
        )}

        {step === 'date' && (
          <>
            <div style={S.modalSubtitle}>결석 기간을 선택해주세요</div>
            <div style={S.dateRow}>
              <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={S.dateInput} />
              <span style={S.modalDateSep}>~</span>
              <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={S.dateInput} />
            </div>
            <div style={S.modalBtnRow}>
              <button style={S.modalCancelBtn} onClick={() => setStep('reason')}>이전</button>
              <button style={S.modalNextBtn} onClick={handleConfirm}>{isEdit ? '수정 완료' : '등록 완료'}</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ========================= 휴원 처리 모달 ========================= */
function EnrollmentModal({ student, onClose, onConfirm }) {
  const [reasonType, setReasonType] = useState('');
  const [customReason, setCustomReason] = useState('');
  const [startDate, setStartDate] = useState(dateKeyToInputValue(new Date()));

  if (!student) return null;

  const canConfirm = !!reasonType && (reasonType !== 'other' || customReason.trim().length > 0);

  const handleConfirm = () => {
    if (!canConfirm) return;
    onConfirm({
      studentId: student.id,
      reasonType,
      customReason: reasonType === 'other' ? customReason.trim() : '',
      startDate,
    });
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>{student.label} 휴원 처리</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>

        <div style={S.modalSubtitle}>휴원 사유를 선택해주세요</div>
        <div style={S.reasonGrid}>
          {REASON_OPTIONS.map(opt => (
            <button
              key={opt.key}
              style={{ ...S.reasonBtn, ...(reasonType === opt.key ? S.reasonBtnActive : {}) }}
              onClick={() => setReasonType(opt.key)}
            >
              {opt.label}
            </button>
          ))}
        </div>
        {reasonType === 'other' && (
          <input
            type="text"
            placeholder="휴원 사유를 입력해주세요"
            value={customReason}
            onChange={e => setCustomReason(e.target.value)}
            style={S.reasonCustomInput}
          />
        )}

        <div style={S.modalSubtitle}>휴원 시작일</div>
        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={S.dateInput} />
        <div style={S.hint}>시작일부터, 직접 "재원 처리"로 해제하기 전까지 출석부(화면·엑셀 모두)에 휴원으로 빨갛게 표시돼요.</div>

        <div style={S.modalBtnRow}>
          <button style={S.modalCancelBtn} onClick={onClose}>취소</button>
          <button
            style={{ ...S.modalNextBtn, ...(canConfirm ? {} : S.modalNextBtnDisabled) }}
            onClick={handleConfirm}
            disabled={!canConfirm}
          >
            휴원 처리
          </button>
        </div>
      </div>
    </div>
  );
}

function SettingsTab({ students, meta, metaOf, onUpdate, search, setSearch, cho, setCho, gradeFilter, setGradeFilter, onOpenAbsenceModal, onOpenAddStudent, onOpenEditStudent, onDeleteStudent, enrollments, onOpenEnrollmentModal, onReleaseEnrollment }) {
  const filtered = useMemo(() => {
    return (students || []).filter(s => {
      if (search && !s.name.includes(search)) return false;
      if (cho && chosungBase(s.name) !== cho) return false;
      if (gradeFilter && s.grade !== gradeFilter) return false;
      return true;
    });
  }, [students, search, cho, gradeFilter]);

  const handleDelete = (s) => {
    if (window.confirm(`${s.label} 원생을 목록에서 삭제할까요?\n(지금까지의 출석 기록은 남아있어요)`)) {
      onDeleteStudent(s.id, s.label);
    }
  };

  return (
    <div>
      <Section title="원생 관리">
        <button style={S.primaryBtn} onClick={onOpenAddStudent}>+ 원생 추가</button>
        <div style={S.hint}>새 원생을 등록하거나, 아래 목록에서 각 원생의 정보 수정·삭제·등원 요일 설정을 할 수 있어요.</div>
      </Section>

      <Section title="원생 검색 / 등원 요일 설정">
        <input type="text" placeholder="이름으로 검색" value={search} onChange={e => setSearch(e.target.value)} style={S.searchInput} />
        <div style={S.choGrid}>
          {BASE14.map(c => (
            <button key={c} onClick={() => setCho(cho === c ? '' : c)} style={{ ...S.choBtn, ...(cho === c ? S.choBtnActive : {}) }}>{c}</button>
          ))}
        </div>
        <div style={{ ...S.gradeGrid, marginTop: 8 }}>
          {GRADES.map(g => (
            <button key={g} onClick={() => setGradeFilter(gradeFilter === g ? '' : g)} style={{ ...S.gradeBtn, ...(gradeFilter === g ? S.gradeBtnActive : {}) }}>{g}</button>
          ))}
        </div>
      </Section>

      <div style={S.settingsList}>
        {filtered.map(s => {
          const m = metaOf(s.id);
          const days = m.days || [];
          const enr = enrollmentOf(s.id, enrollments);
          const onLeave = enr.status === 'leave';
          const handleRelease = () => {
            if (window.confirm(`${s.label} 원생을 재원생으로 전환할까요?`)) onReleaseEnrollment(s.id);
          };
          return (
            <div key={s.id} style={S.settingsCard}>
              <div style={S.settingsCardHead}>
                <div style={S.settingsName}>
                  {s.label} <span style={S.settingsGrade}>{s.grade || '학년미상'}</span>
                  <span style={onLeave ? S.leaveTag : S.enrolledTag}>{onLeave ? '휴원생' : '재원생'}</span>
                </div>
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {onLeave ? (
                    <button style={S.absenceRegBtnSmall} onClick={handleRelease}>재원 처리</button>
                  ) : (
                    <button style={S.deleteBtnSmall} onClick={() => onOpenEnrollmentModal(s)}>휴원 처리</button>
                  )}
                  <button style={S.absenceRegBtnSmall} onClick={() => onOpenAbsenceModal(s)}>결석 등록</button>
                  <button style={S.editBtnSmall} onClick={() => onOpenEditStudent(s)}>정보 수정</button>
                  <button style={S.deleteBtnSmall} onClick={() => handleDelete(s)}>삭제</button>
                </div>
              </div>
              {onLeave && (
                <div style={S.leaveInfoRow}>
                  휴원중 · {enr.startDate}부터 · 사유: {REASON_LABEL_BY_KEY[enr.reasonType] || enr.reasonType || '-'}{enr.reasonType === 'other' && enr.customReason ? `(${enr.customReason})` : ''}
                  {' '}· 직접 "재원 처리"를 누르기 전까진 이 기간 출석부에 휴원(빨간색)으로 표시돼요.
                </div>
              )}
              <div style={S.parentInfoRow}>
                아버님 {formatPhoneLabel(s.fatherName, s.fatherPhone) || '미등록'} · 어머님 {formatPhoneLabel(s.motherName, s.motherPhone) || '미등록'}
              </div>
              <div style={S.dayRow}>
                {DAYS.map(d => (
                  <label key={d} style={{ ...S.dayChip, ...(days.includes(d) ? S.dayChipActive : {}) }}>
                    <input type="checkbox" style={S.hiddenCheckbox}
                      checked={days.includes(d)}
                      onChange={e => {
                        const next = e.target.checked ? [...days, d] : days.filter(x => x !== d);
                        onUpdate(s.id, { days: next });
                      }} />
                    {d}
                  </label>
                ))}
                <button style={S.week5Btn} onClick={() => onUpdate(s.id, { days: [...DAYS] })}>주5회</button>
                <span style={S.freqLabel}>{days.length > 0 ? `주${days.length}회` : '미설정'}</span>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div style={S.hint}>조건에 맞는 원생이 없어요.</div>}
      </div>
    </div>
  );
}

/* ========================= [날짜별 수정] 탭 =========================
 * 날짜를 하나 골라, 그 날짜 기준으로 전 원생의 "최종" 출결 상태(자동 계산 + 수동 오버라이드
 * 반영 결과, resolveDailyAttendance와 완전히 동일한 로직)를 한 화면에서 확인하고,
 * 학생별로 "수정" 버튼을 눌러 그 날짜만 콕 집어 출결을 수동으로 바꿀 수 있다.
 * (여러 명을 한번에 고쳐 저장하는 일괄 수정 UI는 이번 단계에는 포함하지 않는다 - 다음 단계 예정)
 */
function ManualEditTab({ manualEditDate, setManualEditDate, resolvedList, search, setSearch, gradeFilter, setGradeFilter, statusFilter, setStatusFilter, selectedIds, setSelectedIds, onOpenEdit, onBulkAction }) {
  const selectedDateObj = manualEditDate ? new Date(manualEditDate + 'T00:00:00') : null;

  // 상태 필터용: resolveDailyAttendance의 세부 결과를 몇 가지 큰 갈래로 묶는다.
  // (결석 사유 라벨이 '병결'/'여행'/'휴가'/'기타' 등으로 다양하므로 '결석' 한 갈래로 통합)
  const statusBucket = (result) => {
    if (!result) return 'none';
    if (result.isLeave) return 'leave';
    if (result.status === '출석') return 'present';
    if (result.status === '미등원') return 'not_arrived';
    if (!result.status || result.status === '해당없음' || result.status === '휴관') return 'none';
    return 'absent';
  };

  const filtered = useMemo(() => {
    return (resolvedList || []).filter(({ student: s, result }) => {
      if (search && !s.name.includes(search)) return false;
      if (gradeFilter && s.grade !== gradeFilter) return false;
      if (statusFilter && statusBucket(result) !== statusFilter) return false;
      return true;
    });
  }, [resolvedList, search, gradeFilter, statusFilter]);

  const STATUS_FILTERS = [
    { key: '', label: '전체' },
    { key: 'present', label: MANUAL_EDIT_STATUS_LABEL.present },
    { key: 'absent', label: MANUAL_EDIT_STATUS_LABEL.absent },
    { key: 'leave', label: MANUAL_EDIT_STATUS_LABEL.leave },
    { key: 'not_arrived', label: MANUAL_EDIT_STATUS_LABEL.not_arrived },
  ];

  // [일괄 수정] 선택은 학생 id 배열(selectedIds)로 관리하고, 화면에 지금 보이는(필터 적용된) 목록 기준으로 켜고 끈다.
  // 필터를 바꿔도 이미 선택해둔 id 자체는 그대로 유지된다 (다른 상태의 학생을 골라뒀다가 필터를 바꿔 확인하는 경우 대비).
  const filteredIds = filtered.map(({ student: s }) => s.id);
  const selectedSet = new Set(selectedIds || []);
  const selectedInViewCount = filteredIds.filter(id => selectedSet.has(id)).length;

  const toggleOne = (id) => {
    setSelectedIds(prev => (prev || []).includes(id) ? (prev || []).filter(x => x !== id) : [...(prev || []), id]);
  };
  const selectAll = () => {
    setSelectedIds(prev => Array.from(new Set([...(prev || []), ...filteredIds])));
  };
  const deselectAll = () => setSelectedIds([]);

  const BULK_ACTIONS = [
    { key: MANUAL_STATUS.PRESENT, label: `→ ${MANUAL_EDIT_STATUS_LABEL.present}` },
    { key: MANUAL_STATUS.ABSENT, label: `→ ${MANUAL_EDIT_STATUS_LABEL.absent}` },
    { key: MANUAL_STATUS.LEAVE, label: `→ ${MANUAL_EDIT_STATUS_LABEL.leave}` },
    { key: MANUAL_STATUS.NOT_ARRIVED, label: `→ ${MANUAL_EDIT_STATUS_LABEL.not_arrived}` },
  ];

  return (
    <div>
      <Section title="날짜 선택">
        <div style={S.dateRow}>
          <input type="date" value={manualEditDate} onChange={e => setManualEditDate(e.target.value)} style={S.dateInput} />
        </div>
        {selectedDateObj && (
          <div style={S.hint}>{displayDateLong(selectedDateObj)} 기준 출결 현황이에요. 자동 계산 결과에 수동 수정 기록이 있으면 그 값이 우선 표시돼요.</div>
        )}
      </Section>

      <Section title="원생 검색 / 필터">
        <input type="text" placeholder="이름으로 검색" value={search} onChange={e => setSearch(e.target.value)} style={S.searchInput} />
        <div style={S.gradeGrid}>
          {GRADES.map(g => (
            <button key={g} onClick={() => setGradeFilter(gradeFilter === g ? '' : g)}
              style={{ ...S.gradeBtn, ...(gradeFilter === g ? S.gradeBtnActive : {}) }}>{g}</button>
          ))}
        </div>
        <div style={{ ...S.dayRow, marginTop: 8 }}>
          {STATUS_FILTERS.map(f => (
            <button key={f.key} onClick={() => setStatusFilter(f.key)}
              style={{ ...S.choBtn, width: 'auto', padding: '8px 12px', fontSize: 12.5, ...(statusFilter === f.key ? S.choBtnActive : {}) }}>
              {f.label}
            </button>
          ))}
        </div>
      </Section>

      <Section title="일괄 수정">
        <div style={S.bulkSelectRow}>
          <button style={S.bulkSelectBtn} onClick={selectAll}>전체 선택</button>
          <button style={S.bulkSelectBtn} onClick={deselectAll}>선택 해제</button>
          <span style={S.bulkSelectCount}>{selectedInViewCount}명 선택됨</span>
        </div>
        <div style={S.bulkActionGrid}>
          {BULK_ACTIONS.map(a => (
            <button
              key={a.key}
              style={{ ...S.bulkActionBtn, ...(selectedInViewCount === 0 ? S.bulkActionBtnDisabled : {}) }}
              disabled={selectedInViewCount === 0}
              onClick={() => onBulkAction(a.key)}
            >
              {a.label}
            </button>
          ))}
        </div>
        <div style={S.hint}>선택한 학생에게만 {selectedDateObj ? displayDateLong(selectedDateObj) : '선택한 날짜'} 기록으로 적용돼요. 적용 전에 확인 절차가 있어요.</div>
      </Section>

      <div style={S.settingsList}>
        {filtered.map(({ student: s, result }) => (
          <div key={s.id} style={S.settingsCard}>
            <div style={S.settingsCardHead}>
              <label style={S.bulkCheckLabel}>
                <input type="checkbox" checked={selectedSet.has(s.id)} onChange={() => toggleOne(s.id)} />
              </label>
              <div style={{ ...S.settingsName, flex: 1 }}>
                {s.label} <span style={S.settingsGrade}>{s.grade || '학년미상'}</span>
              </div>
              <button style={S.editBtnSmall} onClick={() => onOpenEdit(s)}>수정</button>
            </div>
            <div style={S.parentInfoRow}>
              <span style={{ ...S.manualStatusTag, ...(S.manualStatusTagByBucket[statusBucket(result)] || {}) }}>
                {result.displayText || '해당없음'}
              </span>
              {result.isManual && <span style={S.manualOverrideTag}>수동수정됨</span>}
            </div>
          </div>
        ))}
        {filtered.length === 0 && <div style={S.hint}>조건에 맞는 원생이 없어요.</div>}
      </div>
    </div>
  );
}

/* ========================= [날짜별 수정] 일괄 수정 모달 =========================
 * ManualEditModal(개별 수정)과 동일한 입력 UI를 재사용하되, 대상이 "선택된 여러 학생 전체"라는 점만 다르다.
 * - 등원: 시간반/출석 시각 입력 가능 (선택)
 * - 결석: 결석 사유(및 기타 사유) 필수
 * - 휴원: 휴원 사유 입력 가능 (선택)
 * - 미등원: 별도 입력 없음
 * "적용" 버튼을 누르면 window.confirm으로 한번 더 확인을 받은 뒤에만 실제로 저장한다.
 */
function BulkManualEditModal({ status, selectedCount, onClose, onConfirm }) {
  const [time, setTime] = useState('');
  const [timeband, setTimeband] = useState('');
  const [absenceReason, setAbsenceReason] = useState('');
  const [customReason, setCustomReason] = useState('');
  const [leaveReason, setLeaveReason] = useState('');

  if (!status) return null;

  const label = MANUAL_EDIT_STATUS_LABEL[status] || status;
  const canSave = status !== MANUAL_STATUS.ABSENT || (!!absenceReason && (absenceReason !== '기타' || customReason.trim().length > 0));

  const handleSetNowTime = () => {
    const t = new Date();
    setTime(`${pad2(t.getHours())}:${pad2(t.getMinutes())}`);
  };

  const handleApply = () => {
    if (!canSave || selectedCount === 0) return;
    const ok = window.confirm(`선택한 ${selectedCount}명을 '${label}'(으)로 일괄 처리할까요?\n(선택한 날짜에만 적용돼요)`);
    if (!ok) return;
    onConfirm({
      status,
      time: status === MANUAL_STATUS.PRESENT ? time.trim() : '',
      timeband: status === MANUAL_STATUS.PRESENT ? timeband.trim() : '',
      absenceReason: status === MANUAL_STATUS.ABSENT ? absenceReason : '',
      customReason: status === MANUAL_STATUS.ABSENT && absenceReason === '기타' ? customReason.trim() : '',
      leaveReason: status === MANUAL_STATUS.LEAVE ? leaveReason.trim() : '',
    });
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>선택 학생 일괄 · {label}</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.modalSubtitle}>선택된 {selectedCount}명에게 적용돼요.</div>

        {status === MANUAL_STATUS.PRESENT && (
          <>
            <div style={S.hint}>시간반 (선택)</div>
            <div style={S.bandGrid}>
              {TIMEBANDS.map(b => (
                <button key={b} onClick={() => setTimeband(timeband === b ? '' : b)}
                  style={{ ...S.bandBtn, ...(timeband === b ? S.bandBtnActive : {}) }}>{b}</button>
              ))}
            </div>
            <div style={S.hint}>출석 시각 (선택)</div>
            <div style={S.timeInputRow}>
              <input type="text" placeholder="예: 15:30" value={time} onChange={e => setTime(e.target.value)} style={S.timeInput} />
              <button type="button" style={S.nowTimeBtn} onClick={handleSetNowTime}>현재 시각</button>
            </div>
          </>
        )}

        {status === MANUAL_STATUS.ABSENT && (
          <>
            <div style={S.reasonGrid}>
              {REASON_OPTIONS.map(opt => (
                <button key={opt.key}
                  style={{ ...S.reasonBtn, ...(absenceReason === opt.label ? S.reasonBtnActive : {}) }}
                  onClick={() => setAbsenceReason(opt.label)}>
                  {opt.label}
                </button>
              ))}
            </div>
            {absenceReason === '기타' && (
              <input type="text" placeholder="결석 사유를 입력해주세요" value={customReason} onChange={e => setCustomReason(e.target.value)} style={S.reasonCustomInput} />
            )}
          </>
        )}

        {status === MANUAL_STATUS.LEAVE && (
          <input type="text" placeholder="휴원 사유 (선택)" value={leaveReason} onChange={e => setLeaveReason(e.target.value)} style={S.reasonCustomInput} />
        )}

        {status === MANUAL_STATUS.NOT_ARRIVED && (
          <div style={S.hint}>별도 입력 없이 선택한 학생 전체를 미등원으로 표시해요.</div>
        )}

        <div style={S.modalBtnRow}>
          <button style={S.modalCancelBtn} onClick={onClose}>취소</button>
          <button style={{ ...S.modalNextBtn, ...(canSave ? {} : S.modalNextBtnDisabled) }} onClick={handleApply} disabled={!canSave}>
            {selectedCount}명 적용
          </button>
        </div>
      </div>
    </div>
  );
}

/* ========================= [날짜별 수정] 개별 학생 수정 모달 =========================
 * 한 학생의 한 날짜(dateStr)만 콕 집어 출결 상태를 수동으로 지정하거나(setManualAttendance),
 * 기존 수동 기록을 지우고 자동 계산 결과로 되돌린다(clearManualAttendance).
 */
function ManualEditModal({ student, dateStr, currentRecord, resolvedResult, onClose, onSave, onClear }) {
  const [status, setStatus] = useState(currentRecord ? currentRecord.status : (MANUAL_STATUS.PRESENT));
  const [time, setTime] = useState(currentRecord ? currentRecord.time : '');
  const [timeband, setTimeband] = useState(currentRecord ? currentRecord.timeband : '');
  const [absenceReason, setAbsenceReason] = useState(currentRecord ? currentRecord.absenceReason : '');
  const [customReason, setCustomReason] = useState(currentRecord ? currentRecord.customReason : '');
  const [leaveReason, setLeaveReason] = useState(currentRecord ? (currentRecord.leaveReason || '') : '');

  if (!student || !dateStr) return null;

  const STATUS_OPTIONS = [
    { key: MANUAL_STATUS.PRESENT, label: '등원' },
    { key: MANUAL_STATUS.ABSENT, label: '결석' },
    { key: MANUAL_STATUS.LEAVE, label: '휴원' },
    { key: MANUAL_STATUS.NOT_ARRIVED, label: '미등원' },
  ];

  const canSave = status !== MANUAL_STATUS.ABSENT || (!!absenceReason && (absenceReason !== '기타' || customReason.trim().length > 0));

  const handleSetNowTime = () => {
    const t = new Date();
    setTime(`${pad2(t.getHours())}:${pad2(t.getMinutes())}`);
  };

  const handleSave = () => {
    if (!canSave) return;
    onSave({
      status,
      time: status === MANUAL_STATUS.PRESENT ? time.trim() : '',
      timeband: status === MANUAL_STATUS.PRESENT ? timeband.trim() : '',
      absenceReason: status === MANUAL_STATUS.ABSENT ? absenceReason : '',
      customReason: status === MANUAL_STATUS.ABSENT && absenceReason === '기타' ? customReason.trim() : '',
      leaveReason: status === MANUAL_STATUS.LEAVE ? leaveReason.trim() : '',
    });
  };

  const d = new Date(dateStr + 'T00:00:00');

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>{student.label} 출결 수정</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.modalSubtitle}>
          {displayDateLong(d)} · 현재 표시: {(resolvedResult && resolvedResult.displayText) || '해당없음'}
        </div>

        <div style={S.reasonGrid}>
          {STATUS_OPTIONS.map(opt => (
            <button key={opt.key}
              style={{ ...S.reasonBtn, ...(status === opt.key ? S.reasonBtnActive : {}) }}
              onClick={() => setStatus(opt.key)}>
              {opt.label}
            </button>
          ))}
        </div>

        {status === MANUAL_STATUS.PRESENT && (
          <>
            <div style={S.hint}>시간반 (선택)</div>
            <div style={S.bandGrid}>
              {TIMEBANDS.map(b => (
                <button key={b} onClick={() => setTimeband(timeband === b ? '' : b)}
                  style={{ ...S.bandBtn, ...(timeband === b ? S.bandBtnActive : {}) }}>{b}</button>
              ))}
            </div>
            <div style={S.hint}>출석 시각 (선택)</div>
            <div style={S.timeInputRow}>
              <input type="text" placeholder="예: 15:30" value={time} onChange={e => setTime(e.target.value)} style={S.timeInput} />
              <button type="button" style={S.nowTimeBtn} onClick={handleSetNowTime}>현재 시각</button>
            </div>
          </>
        )}

        {status === MANUAL_STATUS.ABSENT && (
          <>
            <div style={S.reasonGrid}>
              {REASON_OPTIONS.map(opt => (
                <button key={opt.key}
                  style={{ ...S.reasonBtn, ...(absenceReason === opt.label ? S.reasonBtnActive : {}) }}
                  onClick={() => setAbsenceReason(opt.label)}>
                  {opt.label}
                </button>
              ))}
            </div>
            {absenceReason === '기타' && (
              <input type="text" placeholder="결석 사유를 입력해주세요" value={customReason} onChange={e => setCustomReason(e.target.value)} style={S.reasonCustomInput} />
            )}
          </>
        )}

        {status === MANUAL_STATUS.LEAVE && (
          <input type="text" placeholder="휴원 사유 (선택)" value={leaveReason} onChange={e => setLeaveReason(e.target.value)} style={S.reasonCustomInput} />
        )}

        <div style={S.modalBtnRow}>
          <button style={S.modalCancelBtn} onClick={onClose}>취소</button>
          <button style={{ ...S.modalNextBtn, ...(canSave ? {} : S.modalNextBtnDisabled) }} onClick={handleSave} disabled={!canSave}>저장</button>
        </div>
        {currentRecord && (
          <button style={{ ...S.deleteBtnSmall, width: '100%', marginTop: 8, textAlign: 'center' }} onClick={onClear}>
            수동 수정 기록 지우기 (자동 계산으로 되돌리기)
          </button>
        )}
      </div>
    </div>
  );
}

/* ========================= 휴관일 처리 모달 (체크박스로 여러 날짜 선택) =========================
 * 상단 헤더의 "휴관처리" 버튼을 누르면 열린다.
 * - 달력 형태로 이번 달(또는 이전/다음 달)의 날짜를 체크박스로 여러 개 선택해서
 *   한번에 같은 사유로 휴관 처리할 수 있다.
 * - 이미 휴관으로 등록된 날짜는 사유가 표시되고, 그 자리에서 바로 사유 수정·해제가 가능하다.
 * - 공휴일(HOLIDAYS)은 자동 반영되는 항목이라 체크박스 대상에서 제외하고 참고용 표시만 한다.
 */
function ClosureModal({ closures, initialMonth, onClose, onApply, onUpdateReason, onRemove }) {
  const [monthAnchor, setMonthAnchor] = useState(() => getMonthStart(startOfDay(initialMonth)));
  const [checked, setChecked] = useState({}); // { 'YYYY-MM-DD': true } - 이번에 새로 휴관 처리할 날짜(배치 선택)
  const [reason, setReason] = useState('휴관');
  const [detailKey, setDetailKey] = useState(null); // 달력에서 탭해서 상세(수정/해제) 패널을 연 날짜
  const [editingReason, setEditingReason] = useState('');

  const monthDays = useMemo(() => getMonthDateList(monthAnchor), [monthAnchor]);
  const monthLabel = `${monthAnchor.getFullYear()}년 ${monthAnchor.getMonth() + 1}월`;
  const leadPad = monthDays[0].getDay(); // 1일이 그 주의 몇번째 칸인지 (0=일)
  const trailPad = 6 - monthDays[monthDays.length - 1].getDay();

  const checkedKeys = Object.keys(checked).filter(dk => checked[dk]);

  const goMonth = (delta) => {
    setMonthAnchor(prev => new Date(prev.getFullYear(), prev.getMonth() + delta, 1));
    setDetailKey(null);
  };

  const handleApply = () => {
    if (checkedKeys.length === 0) return;
    onApply(checkedKeys, reason.trim() || '휴관');
    setChecked({});
  };

  // 달력 칸 탭: 이미 휴관 등록된 날짜면 수정/해제용 상세 패널을 열고,
  // 등록되지 않은 날짜(공휴일 제외)면 배치 선택 체크를 토글한다.
  const handleCellTap = (dk, hasExisting) => {
    if (hasExisting) {
      setDetailKey(prev => (prev === dk ? null : dk));
      setEditingReason(closures[dk] || '휴관');
    } else {
      setChecked(prev => ({ ...prev, [dk]: !prev[dk] }));
    }
  };

  const saveDetailEdit = () => {
    if (detailKey) onUpdateReason(detailKey, editingReason.trim() || '휴관');
    setDetailKey(null);
  };
  const removeDetail = () => {
    if (detailKey) onRemove(detailKey);
    setDetailKey(null);
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>휴관일 처리</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.modalSubtitle}>날짜를 눌러 선택한 뒤 사유를 적고 적용하세요. 이미 등록된 날짜는 눌러서 수정·해제할 수 있어요.</div>

        <div style={S.monthNavRow}>
          <button style={S.monthNavBtn} onClick={() => goMonth(-1)}>‹ 이전달</button>
          <div style={S.monthNavLabel}>{monthLabel}</div>
          <button style={S.monthNavBtn} onClick={() => goMonth(1)}>다음달 ›</button>
        </div>

        <div style={S.calendarGrid}>
          {['일', '월', '화', '수', '목', '금', '토'].map(w => (
            <div key={w} style={{ ...S.calendarWeekdayHead, ...(w === '일' ? S.calendarWeekdaySun : {}), ...(w === '토' ? S.calendarWeekdaySat : {}) }}>{w}</div>
          ))}
          {Array.from({ length: leadPad }).map((_, i) => <div key={`lead${i}`} style={S.calendarCellEmpty} />)}
          {monthDays.map(d => {
            const dk = dateKey(d);
            const dow = d.getDay();
            const holiday = HOLIDAYS[dk]; // 공휴일은 자동 반영되는 항목 - 선택 대상 아님, 참고 표시만
            const existing = closures[dk];
            const isChecked = !!checked[dk];
            const isDetailOpen = detailKey === dk;
            return (
              <button
                key={dk}
                type="button"
                style={{
                  ...S.calendarCell,
                  ...(dow === 0 ? S.calendarCellSun : {}),
                  ...(dow === 6 ? S.calendarCellSat : {}),
                  ...(holiday ? S.calendarCellHoliday : {}),
                  ...(existing && !holiday ? S.calendarCellClosed : {}),
                  ...(isChecked ? S.calendarCellChecked : {}),
                  ...(isDetailOpen ? S.calendarCellDetailOpen : {}),
                }}
                disabled={!!holiday}
                onClick={() => handleCellTap(dk, !!existing)}
              >
                <span style={S.calendarCellNum}>{d.getDate()}</span>
                {(holiday || existing) && (
                  <span style={S.calendarCellTag}>{holiday || existing}</span>
                )}
              </button>
            );
          })}
          {Array.from({ length: trailPad }).map((_, i) => <div key={`trail${i}`} style={S.calendarCellEmpty} />)}
        </div>

        {detailKey && (
          <div style={S.closureExistingWrap}>
            <span style={S.closureDayLabel}>{detailKey} 사유</span>
            <input
              style={S.closureReasonEditInput}
              value={editingReason}
              onChange={e => setEditingReason(e.target.value)}
              placeholder="사유"
            />
            <button style={S.editBtnSmall} onClick={saveDetailEdit}>저장</button>
            <button style={S.deleteBtnSmall} onClick={removeDetail}>해제</button>
          </div>
        )}

        <input
          style={S.reasonCustomInput}
          value={reason}
          onChange={e => setReason(e.target.value)}
          placeholder="휴관 사유 (예: 원 사정, 내부 행사 등)"
        />
        <div style={S.modalBtnRow}>
          <button style={S.modalCancelBtn} onClick={onClose}>닫기</button>
          <button
            style={{ ...S.modalNextBtn, ...(checkedKeys.length === 0 ? S.modalNextBtnDisabled : {}) }}
            disabled={checkedKeys.length === 0}
            onClick={handleApply}
          >
            선택한 {checkedKeys.length}일 휴관 처리
          </button>
        </div>
      </div>
    </div>
  );
}

/** 원생 추가/수정 모달 - student가 없으면 추가 모드, 있으면 수정 모드 */
function StudentFormModal({ student, onClose, onSave }) {
  const isEdit = !!student;
  const [name, setName] = useState(student ? student.name : '');
  const [labelExtra, setLabelExtra] = useState(() => {
    if (!student) return '';
    if (student.label && student.label !== student.name && student.label.startsWith(student.name + '·')) {
      return student.label.slice(student.name.length + 1);
    }
    return '';
  });
  const [grade, setGrade] = useState(student ? (student.grade || '') : '');
  const [fatherName, setFatherName] = useState(student ? (student.fatherName || '') : '');
  const [fatherPhone, setFatherPhone] = useState(student ? (student.fatherPhone || '') : '');
  const [motherName, setMotherName] = useState(student ? (student.motherName || '') : '');
  const [motherPhone, setMotherPhone] = useState(student ? (student.motherPhone || '') : '');

  const canSave = name.trim().length > 0;

  const handleSave = () => {
    if (!canSave) return;
    const trimmedName = name.trim();
    const extra = labelExtra.trim();
    onSave({
      name: trimmedName,
      label: extra ? `${trimmedName}·${extra}` : trimmedName,
      grade,
      fatherName: fatherName.trim(),
      fatherPhone: fatherPhone.trim(),
      motherName: motherName.trim(),
      motherPhone: motherPhone.trim(),
    });
  };

  return (
    <div style={S.modalOverlay} onClick={onClose}>
      <div style={S.modalCard} onClick={e => e.stopPropagation()}>
        <div style={S.modalHeader}>
          <div style={S.modalTitle}>{isEdit ? '원생 정보 수정' : '원생 추가'}</div>
          <button style={S.modalCloseBtn} onClick={onClose}>✕</button>
        </div>

        <div style={S.modalSubtitle}>이름</div>
        <input type="text" placeholder="예: 김시우" value={name} onChange={e => setName(e.target.value)} style={S.reasonCustomInput} />

        <div style={S.modalSubtitle}>구분 표시 (동명이인이 있을 때만, 선택)</div>
        <input type="text" placeholder="예: 백성초등학교" value={labelExtra} onChange={e => setLabelExtra(e.target.value)} style={S.reasonCustomInput} />

        <div style={S.modalSubtitle}>학년</div>
        <select value={grade} onChange={e => setGrade(e.target.value)} style={S.select}>
          <option value="">선택 안함</option>
          {GRADES.map(g => <option key={g} value={g}>{g}</option>)}
        </select>

        <div style={S.modalSubtitle}>아버님 성함 / 연락처</div>
        <div style={S.dateRow}>
          <input type="text" placeholder="성함" value={fatherName} onChange={e => setFatherName(e.target.value)} style={S.dateInput} />
          <input type="tel" placeholder="010-0000-0000" value={fatherPhone} onChange={e => setFatherPhone(e.target.value)} style={S.dateInput} />
        </div>

        <div style={S.modalSubtitle}>어머님 성함 / 연락처</div>
        <div style={S.dateRow}>
          <input type="text" placeholder="성함" value={motherName} onChange={e => setMotherName(e.target.value)} style={S.dateInput} />
          <input type="tel" placeholder="010-0000-0000" value={motherPhone} onChange={e => setMotherPhone(e.target.value)} style={S.dateInput} />
        </div>

        <div style={S.modalBtnRow}>
          <button style={S.modalCancelBtn} onClick={onClose}>취소</button>
          <button
            style={{ ...S.modalNextBtn, ...(canSave ? {} : S.modalNextBtnDisabled) }}
            onClick={handleSave}
            disabled={!canSave}
          >
            저장
          </button>
        </div>
      </div>
    </div>
  );
}

/* ========================= [원생별 출결 다운로드] 탭 =========================
 * 원생을 학년 버튼으로 펼쳐서(또는 이름으로 검색해서) 체크로 고르고,
 * 여러 연도의 여러 월을 동시에 체크해서(일 단위 선택 없음 - 항상 그 달 전체 날짜),
 * 그 조합에 해당하는 원생 × 날짜(선택된 모든 달의 실제 달력 날짜)만 상세 출석부(엑셀)로 내려받는 화면.
 * 실제 엑셀 생성은 App의 exportSelectiveAttendance()가 담당하며(기존 상세 출석부와 동일한 스타일 재사용),
 * 여기서는 학생 0명 / 연월 0개일 때 다운로드 버튼을 비활성화해 실수를 막고,
 * 혹시 모를 경우를 대비해 onExport 결과에 따라 안내만 보여준다(토스트는 App 쪽에서 이미 띄움).
 */
function SelectiveExportTab({ students, search, setSearch, selectedIds, setSelectedIds, periods, setPeriods, onExport, exportBusy }) {
  const [expandedGrades, setExpandedGrades] = useState([]); // 펼쳐진 학년 목록 (검색 중이 아닐 때만 사용)
  const [expandedYears, setExpandedYears] = useState([]); // 월 선택 패널이 펼쳐진 연도 목록

  const searchTerm = (search || '').trim();
  const isSearching = searchTerm.length > 0;

  const searchResults = useMemo(() => {
    if (!isSearching) return [];
    return (students || []).filter(s => s.name.includes(searchTerm))
      .sort((a, b) => (a.grade || '').localeCompare(b.grade || '') || a.name.localeCompare(b.name));
  }, [students, searchTerm, isSearching]);

  // 학년 버튼 UI용: 학년별로 원생을 묶어둔다. GRADES에 없는(학년미상) 원생은 학년 버튼에는 노출하지 않는다
  // (검색으로는 찾을 수 있음).
  const studentsByGrade = useMemo(() => {
    const map = {};
    GRADES.forEach(g => { map[g] = []; });
    (students || []).forEach(s => { if (map[s.grade]) map[s.grade].push(s); });
    GRADES.forEach(g => map[g].sort((a, b) => a.name.localeCompare(b.name)));
    return map;
  }, [students]);

  const selectedSet = new Set(selectedIds || []);
  const selectedCount = (selectedIds || []).length;

  const toggleOne = (id) => {
    setSelectedIds(prev => (prev || []).includes(id) ? (prev || []).filter(x => x !== id) : [...(prev || []), id]);
  };
  // 검색 중일 때는 검색 결과만, 아닐 때는 전체 원생을 대상으로 전체 선택/해제한다.
  const selectAllStudents = () => {
    const idsToAdd = (isSearching ? searchResults : (students || [])).map(s => s.id);
    setSelectedIds(prev => Array.from(new Set([...(prev || []), ...idsToAdd])));
  };
  const deselectAllStudents = () => {
    if (isSearching) {
      const removeSet = new Set(searchResults.map(s => s.id));
      setSelectedIds(prev => (prev || []).filter(id => !removeSet.has(id)));
    } else {
      setSelectedIds([]);
    }
  };

  const toggleGradeExpanded = (g) => {
    setExpandedGrades(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g]);
  };
  const gradeSelectedCount = (g) => (studentsByGrade[g] || []).filter(s => selectedSet.has(s.id)).length;

  const renderStudentRow = (s) => (
    <div key={s.id} style={S.settingsCard}>
      <div style={S.settingsCardHead}>
        <label style={S.bulkCheckLabel}>
          <input type="checkbox" checked={selectedSet.has(s.id)} onChange={() => toggleOne(s.id)} />
        </label>
        <div style={{ ...S.settingsName, flex: 1 }}>
          {s.label} <span style={S.settingsGrade}>{s.grade || '학년미상'}</span>
        </div>
      </div>
    </div>
  );

  // === 연도 / 월 선택 ===
  const yearOptions = useMemo(() => {
    const cur = new Date().getFullYear();
    const list = [];
    for (let y = cur - 3; y <= cur + 1; y++) list.push(y);
    return list;
  }, []);

  const periodList = periods || [];
  const periodKeySet = new Set(periodList.map(p => `${p.year}-${p.month}`));
  const monthsSelectedInYear = (y) => periodList.filter(p => p.year === y).length;
  const isYearFullySelected = (y) => monthsSelectedInYear(y) === 12;

  const toggleMonth = (year, month) => {
    setPeriods(prev => {
      const list = prev || [];
      const exists = list.some(p => p.year === year && p.month === month);
      if (exists) return list.filter(p => !(p.year === year && p.month === month));
      return [...list, { year, month }];
    });
  };
  const toggleYearAll = (year) => {
    if (isYearFullySelected(year)) {
      setPeriods(prev => (prev || []).filter(p => p.year !== year));
    } else {
      setPeriods(prev => {
        const others = (prev || []).filter(p => p.year !== year);
        const full = Array.from({ length: 12 }, (_, i) => ({ year, month: i + 1 }));
        return [...others, ...full];
      });
    }
  };
  const toggleYearExpanded = (y) => {
    setExpandedYears(prev => prev.includes(y) ? prev.filter(x => x !== y) : [...prev, y]);
  };
  const selectAllPeriods = () => {
    const all = [];
    yearOptions.forEach(y => { for (let m = 1; m <= 12; m++) all.push({ year: y, month: m }); });
    setPeriods(all);
  };
  const deselectAllPeriods = () => setPeriods([]);

  const periodsSummary = useMemo(() => formatSelectivePeriodsLabel(periodList), [periodList]);

  const canDownload = selectedCount > 0 && periodList.length > 0 && !exportBusy;

  return (
    <div>
      <Section title="원생 선택">
        <input type="text" placeholder="이름으로 검색" value={search} onChange={e => setSearch(e.target.value)} style={S.searchInput} />
        <div style={S.bulkSelectRow}>
          <button style={S.bulkSelectBtn} onClick={selectAllStudents}>전체 선택</button>
          <button style={S.bulkSelectBtn} onClick={deselectAllStudents}>선택 해제</button>
          <span style={S.bulkSelectCount}>{selectedCount}명 선택됨</span>
        </div>

        {isSearching ? (
          <div style={S.settingsList}>
            {searchResults.map(renderStudentRow)}
            {searchResults.length === 0 && <div style={S.hint}>검색 결과가 없어요.</div>}
          </div>
        ) : (
          <>
            <div style={S.gradeGrid}>
              {GRADES.map(g => {
                const count = (studentsByGrade[g] || []).length;
                const sel = gradeSelectedCount(g);
                const expanded = expandedGrades.includes(g);
                return (
                  <button key={g} onClick={() => toggleGradeExpanded(g)}
                    style={{ ...S.gradeBtn, ...(expanded ? S.gradeBtnActive : {}) }}>
                    {g}{count > 0 ? ` (${sel > 0 ? sel + '/' : ''}${count})` : ''}
                  </button>
                );
              })}
            </div>
            {expandedGrades.map(g => (
              <div key={g} style={S.selectiveGradePanel}>
                <div style={S.selectiveGradePanelTitle}>{g} · {(studentsByGrade[g] || []).length}명</div>
                <div style={S.settingsList}>
                  {(studentsByGrade[g] || []).map(s => (
                    <div key={s.id} style={S.settingsCard}>
                      <div style={S.settingsCardHead}>
                        <label style={S.bulkCheckLabel}>
                          <input type="checkbox" checked={selectedSet.has(s.id)} onChange={() => toggleOne(s.id)} />
                        </label>
                        <div style={{ ...S.settingsName, flex: 1 }}>{s.label}</div>
                      </div>
                    </div>
                  ))}
                  {(studentsByGrade[g] || []).length === 0 && <div style={S.hint}>해당 학년 원생이 없어요.</div>}
                </div>
              </div>
            ))}
          </>
        )}
      </Section>

      <Section title="연도 / 월 선택">
        <div style={S.bulkSelectRow}>
          <button style={S.bulkSelectBtn} onClick={selectAllPeriods}>전체 선택</button>
          <button style={S.bulkSelectBtn} onClick={deselectAllPeriods}>선택 해제</button>
          <span style={S.bulkSelectCount}>{periodList.length}개월 선택됨</span>
        </div>
        {yearOptions.map(y => {
          const cnt = monthsSelectedInYear(y);
          const expanded = expandedYears.includes(y);
          const fullYear = isYearFullySelected(y);
          return (
            <div key={y} style={S.selectiveYearBlock}>
              <div style={S.selectiveYearHead}>
                <button style={{ ...S.gradeBtn, flex: 1, textAlign: 'left' }} onClick={() => toggleYearExpanded(y)}>
                  {expanded ? '▾' : '▸'} {y}년{cnt > 0 ? ` (${cnt}개월 선택)` : ''}
                </button>
                <button style={{ ...S.bulkSelectBtn, ...(fullYear ? S.dayChipActive : {}) }}
                  onClick={() => toggleYearAll(y)}>
                  {fullYear ? `${y}년 전체 해제` : `${y}년 전체`}
                </button>
              </div>
              {expanded && (
                <div style={S.dayRow}>
                  {Array.from({ length: 12 }, (_, i) => i + 1).map(m => (
                    <label key={m} style={{ ...S.dayChip, width: 44, ...(periodKeySet.has(`${y}-${m}`) ? S.dayChipActive : {}) }}>
                      <input type="checkbox" style={S.hiddenCheckbox}
                        checked={periodKeySet.has(`${y}-${m}`)}
                        onChange={() => toggleMonth(y, m)} />
                      {m}월
                    </label>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        <div style={S.hint}>{periodsSummary ? `선택된 기간: ${periodsSummary}` : '선택된 연도/월이 없어요. 일 단위 선택 없이 달 전체가 내려받아져요.'}</div>
      </Section>

      <Section title="다운로드">
        <button
          style={{ ...S.primaryBtn, width: '100%', ...(canDownload ? {} : S.modalNextBtnDisabled) }}
          disabled={!canDownload}
          onClick={() => onExport(selectedIds, periodList)}
        >
          {exportBusy ? '저장 중…' : '선택 항목 엑셀 다운로드'}
        </button>
        <div style={S.hint}>선택한 원생과 선택한 연도/월(해당 달의 모든 날짜)만 포함된 상세 출석부(엑셀)를 내려받아요. 기존 주간/월간 출석부·요약표와는 별개로 동작해요.</div>
      </Section>
    </div>
  );
}

/* ========================= [개인 출석부 - 달력형식 다운로드] 탭 =========================
 * 원생을 1명만 선택하고(라디오 방식), 여러 연도의 여러 월을 체크하면(원생별 출결 다운로드 탭과
 * 동일한 연도/월 선택 UI 재사용), 연도별로 시트 1개씩 만들어 그 안에 선택된 달의 "달력 모양" 표를
 * 1월→2월→… 순서로 3줄씩 띄워 세로로 이어붙인 파일로 내려받는 화면
 * (예: 2023년 1~12월 선택 시 "2023년" 시트 1개 안에 달력 12개, 2023·2024년 전체 선택 시 시트 2개).
 * 실제 엑셀 생성은 App의 exportPersonalCalendarAttendance()가 담당한다.
 */
function PersonalCalendarTab({ students, search, setSearch, selectedId, setSelectedId, periods, setPeriods, onExport, exportBusy }) {
  const [expandedGrades, setExpandedGrades] = useState([]);
  const [expandedYears, setExpandedYears] = useState([]);

  const searchTerm = (search || '').trim();
  const isSearching = searchTerm.length > 0;

  const searchResults = useMemo(() => {
    if (!isSearching) return [];
    return (students || []).filter(s => s.name.includes(searchTerm))
      .sort((a, b) => (a.grade || '').localeCompare(b.grade || '') || a.name.localeCompare(b.name));
  }, [students, searchTerm, isSearching]);

  const studentsByGrade = useMemo(() => {
    const map = {};
    GRADES.forEach(g => { map[g] = []; });
    (students || []).forEach(s => { if (map[s.grade]) map[s.grade].push(s); });
    GRADES.forEach(g => map[g].sort((a, b) => a.name.localeCompare(b.name)));
    return map;
  }, [students]);

  const toggleGradeExpanded = (g) => {
    setExpandedGrades(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g]);
  };

  const selectedStudent = (students || []).find(s => s.id === selectedId) || null;

  const renderStudentRow = (s) => (
    <div key={s.id} style={S.settingsCard}>
      <div style={S.settingsCardHead} onClick={() => setSelectedId(s.id)}>
        <label style={S.bulkCheckLabel} onClick={e => e.stopPropagation()}>
          <input type="radio" name="personal-student" checked={selectedId === s.id} onChange={() => setSelectedId(s.id)} />
        </label>
        <div style={{ ...S.settingsName, flex: 1 }}>
          {s.label} <span style={S.settingsGrade}>{s.grade || '학년미상'}</span>
        </div>
      </div>
    </div>
  );

  // === 연도 / 월 선택 ===
  // 데이터가 없는 2023~2025년, 2026년 1~8월은 목록에서 제외하고,
  // 2026년 9월부터 2029년 12월까지만 선택할 수 있게 한다.
  const yearOptions = useMemo(() => [2026, 2027, 2028, 2029], []);
  const monthsForYear = (y) => (y === 2026 ? [9, 10, 11, 12] : Array.from({ length: 12 }, (_, i) => i + 1));

  const periodList = periods || [];
  const periodKeySet = new Set(periodList.map(p => `${p.year}-${p.month}`));
  const monthsSelectedInYear = (y) => periodList.filter(p => p.year === y).length;
  const isYearFullySelected = (y) => monthsSelectedInYear(y) === monthsForYear(y).length;

  const toggleMonth = (year, month) => {
    setPeriods(prev => {
      const list = prev || [];
      const exists = list.some(p => p.year === year && p.month === month);
      if (exists) return list.filter(p => !(p.year === year && p.month === month));
      return [...list, { year, month }];
    });
  };
  const toggleYearAll = (year) => {
    if (isYearFullySelected(year)) {
      setPeriods(prev => (prev || []).filter(p => p.year !== year));
    } else {
      setPeriods(prev => {
        const others = (prev || []).filter(p => p.year !== year);
        const full = monthsForYear(year).map(m => ({ year, month: m }));
        return [...others, ...full];
      });
    }
  };
  const toggleYearExpanded = (y) => {
    setExpandedYears(prev => prev.includes(y) ? prev.filter(x => x !== y) : [...prev, y]);
  };
  const selectAllPeriods = () => {
    const all = [];
    yearOptions.forEach(y => { monthsForYear(y).forEach(m => all.push({ year: y, month: m })); });
    setPeriods(all);
  };
  const deselectAllPeriods = () => setPeriods([]);

  const periodsSummary = useMemo(() => formatSelectivePeriodsLabel(periodList), [periodList]);

  const canDownload = !!selectedId && periodList.length > 0 && !exportBusy;

  return (
    <div>
      <Section title="원생 선택 (1명)">
        <input type="text" placeholder="이름으로 검색" value={search} onChange={e => setSearch(e.target.value)} style={S.searchInput} />
        <div style={S.hint}>{selectedStudent ? `선택됨: ${selectedStudent.label}` : '원생을 1명 선택해 주세요.'}</div>

        {isSearching ? (
          <div style={S.settingsList}>
            {searchResults.map(renderStudentRow)}
            {searchResults.length === 0 && <div style={S.hint}>검색 결과가 없어요.</div>}
          </div>
        ) : (
          <>
            <div style={S.gradeGrid}>
              {GRADES.map(g => {
                const count = (studentsByGrade[g] || []).length;
                const expanded = expandedGrades.includes(g);
                const hasSelected = (studentsByGrade[g] || []).some(s => s.id === selectedId);
                return (
                  <button key={g} onClick={() => toggleGradeExpanded(g)}
                    style={{ ...S.gradeBtn, ...(expanded ? S.gradeBtnActive : {}) }}>
                    {g}{count > 0 ? ` (${hasSelected ? '1/' : ''}${count})` : ''}
                  </button>
                );
              })}
            </div>
            {expandedGrades.map(g => (
              <div key={g} style={S.selectiveGradePanel}>
                <div style={S.selectiveGradePanelTitle}>{g} · {(studentsByGrade[g] || []).length}명</div>
                <div style={S.settingsList}>
                  {(studentsByGrade[g] || []).map(renderStudentRow)}
                  {(studentsByGrade[g] || []).length === 0 && <div style={S.hint}>해당 학년 원생이 없어요.</div>}
                </div>
              </div>
            ))}
          </>
        )}
      </Section>

      <Section title="연도 / 월 선택">
        <div style={S.bulkSelectRow}>
          <button style={S.bulkSelectBtn} onClick={selectAllPeriods}>전체 선택</button>
          <button style={S.bulkSelectBtn} onClick={deselectAllPeriods}>선택 해제</button>
          <span style={S.bulkSelectCount}>{periodList.length}개월 선택됨</span>
        </div>
        {yearOptions.map(y => {
          const cnt = monthsSelectedInYear(y);
          const expanded = expandedYears.includes(y);
          const fullYear = isYearFullySelected(y);
          return (
            <div key={y} style={S.selectiveYearBlock}>
              <div style={S.selectiveYearHead}>
                <button style={{ ...S.gradeBtn, flex: 1, textAlign: 'left' }} onClick={() => toggleYearExpanded(y)}>
                  {expanded ? '▾' : '▸'} {y}년{cnt > 0 ? ` (${cnt}개월 선택)` : ''}
                </button>
                <button style={{ ...S.bulkSelectBtn, ...(fullYear ? S.dayChipActive : {}) }}
                  onClick={() => toggleYearAll(y)}>
                  {fullYear ? `${y}년 전체 해제` : `${y}년 전체`}
                </button>
              </div>
              {expanded && (
                <div style={S.dayRow}>
                  {monthsForYear(y).map(m => (
                    <label key={m} style={{ ...S.dayChip, width: 44, ...(periodKeySet.has(`${y}-${m}`) ? S.dayChipActive : {}) }}>
                      <input type="checkbox" style={S.hiddenCheckbox}
                        checked={periodKeySet.has(`${y}-${m}`)}
                        onChange={() => toggleMonth(y, m)} />
                      {m}월
                    </label>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        <div style={S.hint}>{periodsSummary ? `선택된 기간: ${periodsSummary}` : '선택된 연도/월이 없어요. 연도별로 시트 1개씩, 그 안에 선택한 달의 달력이 세로로 이어붙여져요.'}</div>
      </Section>

      <Section title="다운로드">
        <button
          style={{ ...S.primaryBtn, width: '100%', ...(canDownload ? {} : S.modalNextBtnDisabled) }}
          disabled={!canDownload}
          onClick={() => onExport(selectedId, periodList)}
        >
          {exportBusy ? '저장 중…' : '개인 출석부(달력형식) 엑셀 다운로드'}
        </button>
        <div style={S.hint}>선택한 원생 1명의 출석 기록을 연도별로 시트 1개씩 만들어(한 시트 안에 1월 달력 → 2월 달력 → … 순서로 3줄 띄워서 세로로 쭉 이어붙임) 한 엑셀 파일로 내려받아요. 예: 2023년 1~12월과 2024년 1~12월을 선택하면 "2023년" 시트 1개(달력 12개), "2024년" 시트 1개(달력 12개), 총 2개 시트가 만들어져요.</div>
      </Section>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <section style={S.section}>
      <h2 style={S.sectionTitle}>{title}</h2>
      {children}
    </section>
  );
}
